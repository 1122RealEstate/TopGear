<script>
'use strict';
/* ============================================================
   Generación de circuitos pseudo-3D
   ============================================================ */
(function (TG) {
  const U = TG.U, C = TG.C;
  const Track = (TG.Track = {});

  Track.build = function (def, opts) {
    opts = opts || {};
    const theme = TG.THEMES[def.theme];
    const rng = U.rng(def.seed);
    const SEG = C.SEG;
    const segs = [];
    const lastY = () => (segs.length ? segs[segs.length - 1].p2.world.y : 0);
    const addSeg = (curve, y) => {
      const n = segs.length;
      segs.push({
        index: n, curve,
        p1: { world: { x: 0, y: lastY(), z: n * SEG }, camera: {}, screen: {} },
        p2: { world: { x: 0, y, z: (n + 1) * SEG }, camera: {}, screen: {} },
        sprites: [], cars: [], pickups: [], band: 0, fog: 1, clip: 0, vis: false,
      });
    };
    const addRoad = (enter, hold, leave, curve, height) => {
      const startY = lastY(), endY = startY + (height || 0) * SEG, total = enter + hold + leave;
      for (let n = 0; n < enter; n++) addSeg(U.easeIn(0, curve, n / enter), U.easeInOut(startY, endY, (n + 1) / total));
      for (let n = 0; n < hold; n++) addSeg(curve, U.easeInOut(startY, endY, (enter + n + 1) / total));
      for (let n = 0; n < leave; n++) addSeg(U.easeInOut(curve, 0, n / leave), U.easeInOut(startY, endY, (enter + hold + n + 1) / total));
    };

    const target = def.segments;
    const maxC = def.maxCurve, maxH = def.maxHill;
    const curvy = def.curvy, hilly = def.hilly;
    const FULL = Math.PI * 2 * SEG; // suma de curvas de una vuelta completa
    let turn = 0;
    const countTurn = (from) => { for (let i = from; i < segs.length; i++) turn += segs[i].curve; };
    const hill = () => {
      if (rng() > hilly) return 0;
      const y = lastY() / SEG;
      let h = rng.range(maxH * 0.3, maxH) * (rng() < 0.5 ? -1 : 1);
      if (y + h > maxH * 1.5) h = -Math.abs(h);
      if (y + h < -maxH * 1.5) h = Math.abs(h);
      return h;
    };

    addRoad(0, 44, 0, 0, 0); // recta de salida
    let guard = 0;
    while (segs.length < target - 190 && guard++ < 400) {
      const from = segs.length;
      const prog = segs.length / target;
      const bias = U.clamp((prog * FULL - turn) / (FULL * 0.25), -1, 1);
      const dir = rng() < 0.5 + bias * 0.42 ? 1 : -1;
      const pStraight = 0.3 - curvy * 0.16;
      const r = rng();
      if (r < pStraight) {
        const h = hill();
        if (h) addRoad(20, rng.int(15, 50), 20, 0, h);
        else addRoad(0, rng.int(25, 80), 0, 0, 0);
      } else if (r < pStraight + 0.3) {
        const c = dir * rng.range(maxC * (0.38 + curvy * 0.22), maxC);
        addRoad(rng.int(15, 30), rng.int(20, 70), rng.int(15, 30), c, hill());
      } else if (r < pStraight + 0.5) {
        const c = rng.range(maxC * 0.45, maxC * 0.9);
        addRoad(rng.int(14, 24), rng.int(12, 40), rng.int(14, 24), dir * c, hill());
        addRoad(rng.int(14, 24), rng.int(12, 40), rng.int(14, 24), -dir * c * rng.range(0.7, 1.05), hill());
      } else if (r < pStraight + 0.61) {
        addRoad(rng.int(30, 50), rng.int(60, 120), rng.int(30, 50), dir * rng.range(maxC * 0.25, maxC * 0.5), hill());
      } else if (r < pStraight + 0.72) {
        const n = rng.int(2, 4);
        for (let i = 0; i < n; i++) {
          const h = rng.range(maxH * 0.15, maxH * 0.42) * (0.4 + hilly);
          addRoad(12, 10, 12, 0, h);
          addRoad(12, 10, 12, 0, -h);
        }
      } else if (r < pStraight + 0.83) {
        const c = rng.range(maxC * 0.6, maxC);
        addRoad(8, rng.int(8, 14), 8, dir * c, 0);
        addRoad(8, rng.int(8, 14), 8, -dir * c, 0);
      } else {
        const c = dir * Math.min(maxC * 1.12, 7.4);
        addRoad(rng.int(20, 30), rng.int(35, 75), rng.int(20, 30), c, hill());
      }
      countTurn(from);
    }
    // volver a altura 0
    const y = lastY() / SEG;
    if (Math.abs(y) > 0.01) addRoad(40, Math.round(20 + Math.abs(y)), 40, 0, -y);
    addRoad(0, Math.max(60, target - segs.length), 0, 0, 0); // recta de meta (parrilla)
    segs[segs.length - 1].p2.world.y = 0;
    segs.forEach((s, i) => { s.band = Math.floor(i / C.RUMBLE) % 2; });

    const track = {
      def, theme, segments: segs, N: segs.length, length: segs.length * SEG,
      coins: opts.coins !== false,
    };
    track.findSegment = (z) => segs[Math.floor(z / SEG) % segs.length];
    placeScenery(track, U.rng(def.seed * 7 + 3));
    placePickups(track, U.rng(def.seed * 13 + 5), opts);
    track.map = minimap(segs);
    return track;
  };

  function placeScenery(track, rng) {
    const segs = track.segments, N = track.N, th = track.theme;
    const put = (i, name, offset, extra) => { segs[i].sprites.push(Object.assign({ name, offset }, extra || {})); };
    const free = (i, off, minD) => {
      for (let k = Math.max(0, i - 2); k <= Math.min(N - 1, i + 2); k++) {
        const list = segs[k].sprites;
        for (let j = 0; j < list.length; j++) {
          const s = list[j];
          if (s.center) continue;
          if (Math.sign(s.offset) === Math.sign(off) && Math.abs(s.offset - off) < minD) return false;
        }
      }
      return true;
    };
    put(1, 'gantry', 0, { center: true });
    if (th.id === 'kyoto' || th.id === 'fuji') {
      for (let i = 160; i < N - 100; i += th.id === 'kyoto' ? 180 : 320) {
        let ok = true;
        for (let k = i - 5; k < i + 5; k++) if (Math.abs(segs[k].curve) > 1.5) ok = false;
        if (ok) put(i, 'torii', 0, { center: true });
      }
    }
    // chevrones en el exterior de las curvas
    for (let i = 0; i < N; i++) {
      const c = segs[i].curve;
      if (Math.abs(c) >= 2.6 && i % 9 === 0) put(i, c > 0 ? 'chevR' : 'chevL', (c > 0 ? -1 : 1) * 1.3);
    }
    th.scenery.forEach((rule) => {
      const place = (i, sd) => {
        const off = Array.isArray(rule.off) ? rng.range(rule.off[0], rule.off[1]) : rule.off;
        const o = sd * off;
        let name = rng.pick(rule.s);
        if (rule.lr) name += sd < 0 ? 'L' : 'R';
        if (!free(i, o, rule.every ? 0.34 : 0.5)) return;
        put(i, name, o);
      };
      for (let i = 6; i < N - 3; i++) {
        if (rule.every) {
          if ((i + (rule.phase || 0)) % rule.every !== 0) continue;
          if (rule.near && i > rule.near && i < N - rule.near) continue;
          if (rule.both) { place(i, -1); place(i, 1); }
          else place(i, rng() < 0.5 ? -1 : 1);
        } else {
          if (rng() < rule.p) place(i, -1);
          if (rng() < rule.p) place(i, 1);
        }
      }
    });
    // ordenar de fuera hacia dentro para el pintado
    segs.forEach((s) => s.sprites.sort((a, b) => Math.abs(b.offset) - Math.abs(a.offset)));
  }

  function placePickups(track, rng, opts) {
    const segs = track.segments, N = track.N;
    const calm = (i) => {
      for (let k = i - 12; k < i + 40; k++) if (Math.abs(segs[((k % N) + N) % N].curve) > 3.2) return false;
      return true;
    };
    const lanes = [-0.62, 0, 0.62];
    const add = (i, type, x) => segs[((i % N) + N) % N].pickups.push({ type, x, taken: [-99, -99], spin: rng() * 6 });
    const spot = (frac) => {
      const base = Math.floor(N * frac);
      for (let d = 0; d < N * 0.2; d += 5) {
        for (const s of [1, -1]) {
          const i = base + s * d;
          if (i > 70 && i < N - 90 && calm(i)) return i;
        }
      }
      return base;
    };
    if (opts.fuel !== false) [0.3, 0.72].forEach((f) => add(spot(f), 'fuel', rng.pick(lanes)));
    add(spot(0.52), 'nitro', rng.pick(lanes));
    if (opts.coins !== false) {
      [0.14, 0.42, 0.62, 0.86].forEach((f) => {
        const i = spot(f);
        let lane = rng.int(0, 2);
        for (let k = 0; k < 6; k++) {
          if (k === 3 && rng() < 0.5) lane = U.clamp(lane + (rng() < 0.5 ? -1 : 1), 0, 2);
          add(i + k * 6, 'coin', lanes[lane]);
        }
      });
    }
  }

  function minimap(segs) {
    const N = segs.length;
    let H = 0;
    for (let i = 0; i < N; i++) H += segs[i].curve / C.SEG;
    const target = (H >= 0 ? 1 : -1) * Math.PI * 2;
    const corr = (target - H) / N;
    const pts = new Float32Array(N * 2);
    let th = 0, x = 0, y = 0;
    for (let i = 0; i < N; i++) {
      pts[i * 2] = x; pts[i * 2 + 1] = y;
      th += segs[i].curve / C.SEG + corr;
      x += Math.sin(th); y -= Math.cos(th);
    }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < N; i++) {
      const t = i / N;
      pts[i * 2] -= x * t; pts[i * 2 + 1] -= y * t;
      minX = Math.min(minX, pts[i * 2]); maxX = Math.max(maxX, pts[i * 2]);
      minY = Math.min(minY, pts[i * 2 + 1]); maxY = Math.max(maxY, pts[i * 2 + 1]);
    }
    const span = Math.max(maxX - minX, maxY - minY) || 1;
    for (let i = 0; i < N; i++) {
      pts[i * 2] = (pts[i * 2] - (minX + maxX) / 2) / span;
      pts[i * 2 + 1] = (pts[i * 2 + 1] - (minY + maxY) / 2) / span;
    }
    return { pts, w: (maxX - minX) / span, h: (maxY - minY) / span };
  }
})(window.TG);

</script>
<script>
'use strict';
/* ============================================================
   Simulación de carrera
   ============================================================ */
(function (TG) {
  const U = TG.U, C = TG.C;
  const INTRO = 2.6, COUNT = 3.0;
  const LANES = [-0.62, 0, 0.62];

  function makeCar(model, color, up, o) {
    const st = TG.carStats(model, up);
    return {
      id: Math.random().toString(36).slice(2, 8),
      model, color, up: up || {}, st, name: o.name || '', isPlayer: !!o.player, pIndex: o.pIndex == null ? -1 : o.pIndex,
      profile: o.profile || 'solo', autopilot: !!o.autopilot, manual: !!o.manual,
      z: 0, x: 0, speed: 0, lapsDone: -1, finished: false, finishTime: 0, finishPos: 0, progress: 0, pos: 0,
      steer: 0, steerVis: 0, throttle: 0, braking: false, vx: 0, latV: 0, lastX: 0, lastSpeed: 0, lastThr: 0,
      vis: { yaw: 0, roll: 0, rollV: 0, pitch: 0, pitchV: 0, heave: 0, heaveV: 0, steer: 0, blur: 0 },
      backfire: 0, shiftPuff: 0, burn: 0, bumpSmoke: 0,
      gear: 1, rpm: model.eng.idle, shiftT: 0,
      nitroN: st.nitroN, nitroT: 0, fuel: 100,
      offroad: false, crashT: 0, bumpT: 0, slip: 0, air: 0, airV: 0, draft: 0, spinT: 0, perfect: false,
      lapStart: 0, lastLap: null, bestLap: null, laps: [],
      coins: 0, coinMoney: 0, crashes: 0, apLane: 0, apLaneT: 0,
      ai: null, spr: null, inp: null, lowFuelWarned: false,
    };
  }

  class Race {
    constructor(cfg) {
      this.cfg = cfg;
      this.mode = cfg.mode;
      this.demo = cfg.mode === 'demo';
      const def = TG.TRACKS[cfg.trackId];
      this.def = def;
      this.cup = TG.CUPS[def.cup];
      const noMoney = cfg.mode === 'time' || cfg.mode === 'versus' || this.demo;
      this.track = TG.Track.build(def, { coins: !noMoney, fuel: !this.demo });
      this.theme = this.track.theme;
      this.laps = this.demo ? 9999 : cfg.laps || 3;
      this.time = 0;
      this.phase = this.demo ? 'race' : 'intro';
      this.phaseT = 0;
      this.cars = [];
      this.players = [];
      this.events = [];
      this.finishedCount = 0;
      this.acc = 0;
      this.coinValue = this.cup.coin;
      const lapTime = this.track.length / (this.cup.ai * C.KMH * 0.88);
      this.fuelRate = 100 / (2.6 * lapTime);
      const weather = this.theme.weather;
      this.gripW = weather === 'rain' ? 0.86 : weather === 'snow' ? 0.8 : 1;

      cfg.players.forEach((pc, i) => {
        const model = TG.CAR[pc.carId];
        const car = makeCar(model, pc.color, pc.up, {
          player: true, pIndex: i, profile: pc.profile, autopilot: pc.autopilot || this.demo, manual: pc.manual, name: pc.name,
        });
        this.cars.push(car);
        this.players.push(car);
      });
      const nAI = cfg.rivals || 0;
      const drivers = cfg.drivers || Race.makeDrivers(this.cup, nAI, def.seed);
      const ref = (cfg.aiRef || this.cup.ai) * C.KMH;
      // dificultad: sube poco a poco con cada carrera del campeonato (0 = primera, 1 = última)
      const D = TG.DIFFICULTY[TG.Save.data.settings.difficulty] || TG.DIFFICULTY.normal;
      const lvl = this.demo ? 0.5 : U.clamp(TG.raceLevel(def) + D.off, 0, 1);
      this.level = lvl;
      drivers.slice(0, nAI).forEach((d, rank) => {
        const model = TG.CAR[d.carId];
        const car = makeCar(model, d.color, {}, { name: d.name });
        const skill = d.skill != null ? d.skill : 1 - rank / Math.max(1, nAI);
        const vmax = ref * (0.87 + 0.13 * skill) * (0.972 + 0.052 * lvl) * D.spd * U.rand(0.992, 1.008) * (this.demo ? U.rand(0.8, 0.95) : 1);
        car.ai = {
          vmax, tol: 3.0 + skill * 1.6 + lvl * 0.5, brakeK: 0.075 - lvl * 0.012, lane: 0, laneT: 0, jitter: U.rand(-0.05, 0.05), rubber: 1,
          nitroN: (skill > 0.4 ? 2 : 1) + (lvl > 0.55 && skill > 0.3 ? 1 : 0), skill, did: d.id,
          lvl, mistake: (1 - lvl) * 0.07 * (1.25 - skill), errT: 0, lat: 0.9 + 0.45 * lvl, defT: 0,
        };
        car.st = Object.assign({}, car.st, { vmax, accel: (100 * C.KMH) / model.acc * 1.05 });
        this.cars.push(car);
      });
      this.grid();
      const camH = TG.Save.data.settings.camera === 'far' ? C.CAM_H_FAR : C.CAM_H;
      this.views = this.players.map((p) => ({
        player: p,
        cam: { x: p.x, h: this.demo ? camH : camH * 5, fov: C.FOV, extra: this.demo ? 0 : 7000, shake: 0, base: camH },
        parts: [], msgs: [], flash: 0, hitFlash: 0,
      }));
      if (this.demo) this.views = [this.views[0]];
      this.updatePositions();
      // Contrarreloj: grabación de la vuelta y coche fantasma del récord
      if (this.mode === 'time') {
        this.ghostRec = [];
        this.ghostAcc = 0;
        this.ghostBest = null;
        const g = TG.Save.data.ghosts && TG.Save.data.ghosts[def.id];
        if (g && Array.isArray(g.s) && g.s.length > 8 && TG.CAR[g.car]) {
          this.ghostData = g;
          this.ghostCar = makeCar(TG.CAR[g.car], g.color || TG.CAR[g.car].color, {}, { name: 'Fantasma' });
          this.ghostCar.ghost = true;
          this.ghostCar.visible = false;
        }
      }
    }

    stepGhost(dt) {
      const p = this.players[0];
      if (p.lapsDone >= 0 && !p.finished) {
        this.ghostAcc += dt;
        if (this.ghostAcc >= 0.05) {
          this.ghostAcc -= 0.05;
          this.ghostRec.push(Math.round(p.z / 10), Math.round(p.x * 100));
        }
      }
      const g = this.ghostData, gc = this.ghostCar;
      if (!g || !gc) return;
      if (p.lapsDone < 0 || p.finished) { gc.visible = false; return; }
      const f = (this.time - p.lapStart) / g.dt;
      const i = Math.floor(f);
      const n = g.s.length / 2;
      if (i < 0 || i >= n - 1) { gc.visible = false; return; }
      const k = f - i;
      const L = this.track.length;
      const z0 = g.s[i * 2] * 10;
      let z1 = g.s[i * 2 + 2] * 10;
      if (z1 < z0 - L / 2) z1 += L;
      gc.z = U.increase(0, z0 + (z1 - z0) * k, L);
      gc.x = (g.s[i * 2 + 1] + (g.s[i * 2 + 3] - g.s[i * 2 + 1]) * k) / 100;
      gc.speed = Math.max(0, (z1 - z0) / g.dt);
      gc.visible = true;
    }

    static makeDrivers(cup, n, seed) {
      const r = U.rng((seed || 1) * 31 + 7);
      const names = TG.DRIVERS.slice();
      for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = names[i]; names[i] = names[j]; names[j] = t; }
      const out = [];
      for (let i = 0; i < n; i++) {
        const model = TG.CARS[cup.pool[Math.floor(r() * cup.pool.length)]];
        const color = r() < 0.45 ? model.color : TG.PAINTS[Math.floor(r() * TG.PAINTS.length)].c;
        out.push({ id: 'd' + i, name: names[i % names.length], carId: model.id, color, skill: 1 - i / Math.max(1, n) });
      }
      return out;
    }

    grid() {
      const L = this.track.length, SEG = C.SEG;
      if (this.demo) {
        this.cars.forEach((car, i) => {
          car.z = (L * i) / this.cars.length + U.rand(0, 20) * SEG;
          car.x = U.pick(LANES);
          car.speed = car.st.vmax * 0.8;
          car.lapsDone = 0;
          if (car.ai) car.ai.lane = car.x;
        });
        const p = this.players[0];
        p.x = 0; p.z = SEG * 60; p.speed = p.st.vmax * 0.6;
        return;
      }
      const ais = this.cars.filter((c) => !c.isPlayer).sort((a, b) => b.ai.skill - a.ai.skill);
      ais.forEach((car, i) => {
        const row = Math.floor(i / 2), col = i % 2;
        car.z = L - (row + 1) * 3.4 * SEG - col * 1.6 * SEG;
        car.x = col ? 0.42 : -0.42;
        car.ai.lane = car.x;
      });
      const prow = Math.ceil(ais.length / 2);
      this.players.forEach((p, i) => {
        const col = this.players.length === 1 ? (ais.length % 2) : i;
        const row = this.players.length === 1 ? Math.floor(ais.length / 2) : prow;
        p.z = L - (row + 1) * 3.4 * SEG - col * 1.6 * SEG;
        p.x = col ? 0.42 : -0.42;
        p.apLane = p.x;
      });
    }

    emit(type, data) { this.events.push(Object.assign({ type }, data || {})); }

    readInput(car) {
      const I = TG.Input, p = car.profile;
      return {
        accel: I.action(p, 'accel'), brake: I.action(p, 'brake'), left: I.action(p, 'left'), right: I.action(p, 'right'),
        nitro: I.hit(p, 'nitro'), up: I.hit(p, 'gearUp'), down: I.hit(p, 'gearDown'),
      };
    }

    update(dt) {
      for (const p of this.players) p.inp = p.autopilot ? null : this.readInput(p);
      this.acc += dt;
      let steps = 0;
      while (this.acc >= C.STEP && steps < 14) {
        this.step(C.STEP);
        this.acc -= C.STEP;
        steps++;
        for (const p of this.players) if (p.inp) { p.inp.nitro = false; p.inp.up = false; p.inp.down = false; }
      }
      if (steps >= 14) this.acc = 0;
      this.updateVisuals(dt);
      this.updateCams(dt);
    }

    // Movimiento de la carrocería: guiñada, dirección de las ruedas, balanceo, cabeceo y suspensión
    updateVisuals(dt) {
      if (!(dt > 0)) return;
      const T = this.track;
      const list = this.ghostCar ? this.cars.concat([this.ghostCar]) : this.cars;
      const kx = 1 - Math.exp(-dt * 12), ky = 1 - Math.exp(-dt * 7), ks = 1 - Math.exp(-dt * 14);
      for (let i = 0; i < list.length; i++) {
        const c = list[i], v = c.vis;
        const seg = T.findSegment(c.z);
        const sp = c.speed / c.st.vmax;
        let lv = (c.x - c.lastX) / dt;
        if (Math.abs(lv) > 12) lv = 0;
        c.latV += (lv - c.latV) * kx;
        const acc = U.clamp((c.speed - c.lastSpeed) / dt, -9000, 6000);
        c.lastX = c.x; c.lastSpeed = c.speed;
        // guiñada: el morro sigue la trayectoria; al derrapar entra más en la curva
        const slide = c.isPlayer ? c.slip * 0.15 * (Math.sign(seg.curve) || Math.sign(c.steer) || 0) : 0;
        const spin = c.spinT > 0 ? Math.sin(this.time * 17) * 0.06 : 0;
        // al girar, la carrocería apunta sutilmente hacia el lado del giro y deja ver el costado y la rueda
        const steerYaw = c.isPlayer ? c.steer * 0.13 * Math.min(1, 0.35 + sp * 1.3) : c.steerVis * 0.06 * Math.min(1, sp * 1.6);
        const yawT = U.clamp(((c.latV * C.ROAD_W) / Math.max(c.speed, 1400)) * 0.45 + steerYaw, -0.26, 0.26) + slide + spin;
        v.yaw += (yawT - v.yaw) * ky;
        // ruedas delanteras: giran con la dirección (la IA también las gira en las curvas)
        const st = c.isPlayer ? c.steer : U.clamp(c.steerVis + seg.curve * sp * 0.09, -1, 1);
        v.steer += (st * U.lerp(0.46, 0.3, Math.min(1, sp)) - v.steer) * ks;
        // inclinación sutil hacia el lado al que se gira (derecha → derecha, izquierda → izquierda)
        const turn = c.isPlayer ? c.steer : U.clamp(c.steerVis + seg.curve * sp * 0.09, -1, 1);
        const rollT = U.clamp(turn * 0.042 * Math.min(1, 0.3 + sp * 1.2) + U.clamp(c.latV, -3, 3) * 0.004, -0.06, 0.06);
        v.rollV += ((rollT - v.roll) * 110 - v.rollV * 12) * dt;
        v.roll += v.rollV * dt;
        // cabeceo: se agacha al acelerar y hunde el morro al frenar
        const pitchT = U.clamp(acc > 0 ? acc * 0.000014 : acc * 0.0000075, -0.036, 0.024);
        v.pitchV += ((pitchT - v.pitch) * 95 - v.pitchV * 11) * dt;
        v.pitch += v.pitchV * dt;
        // suspensión: baches fuera de pista y vibración a alta velocidad
        if (c.offroad && c.speed > 200) { v.heaveV += U.rand(-1, 1) * 0.05 * Math.min(1, sp * 1.4); v.rollV += U.rand(-1, 1) * 0.06; }
        else if (sp > 0.5) v.heaveV += U.rand(-1, 1) * 0.004 * sp;
        v.heaveV += (-v.heave * 160 - v.heaveV * 13) * dt;
        v.heave += v.heaveV * dt;
        v.heave = U.clamp(v.heave, -0.02, 0.02);
        v.roll = U.clamp(v.roll, -0.1, 0.1);
        v.pitch = U.clamp(v.pitch, -0.06, 0.05);
        v.blur = sp > 0.28 ? 1 : 0;
      }
    }

    step(dt) {
      this.phaseT += dt;
      if (this.phase === 'intro') {
        this.idle(dt);
        if (this.phaseT >= INTRO) { this.phase = 'count'; this.phaseT = 0; this.countN = 3; this.emit('count', { n: 3 }); }
        return;
      }
      if (this.phase === 'count') {
        this.idle(dt);
        const n = 3 - Math.floor(this.phaseT);
        if (n > 0 && n !== this.countN) { this.countN = n; this.emit('count', { n }); }
        if (this.phaseT >= COUNT) { this.phase = 'race'; this.phaseT = 0; this.emit('go'); this.launch(); }
        return;
      }
      this.time += dt;
      for (let i = 0; i < this.cars.length; i++) {
        const car = this.cars[i];
        if (car.isPlayer) this.stepPlayer(car, dt, car.autopilot ? this.autoInput(car, dt) : car.inp || {});
        else this.stepAI(car, dt);
      }
      if (this.mode === 'time') this.stepGhost(dt);
      this.collisions(dt);
      this.updatePositions();
      this.updateRubber();
      if (!this.demo && this.phase === 'race' && this.players.every((p) => p.finished)) {
        this.phase = 'done'; this.phaseT = 0; this.emit('allFinished');
      }
      if (this.phase === 'done' && this.phaseT > 3.6 && !this.ended) { this.ended = true; this.emit('end'); }
    }

    idle(dt) {
      for (const car of this.players) {
        const acc = !car.autopilot && car.inp && car.inp.accel;
        const eng = car.model.eng;
        const target = eng.idle + (eng.red - eng.idle) * (acc ? 0.95 : 0);
        car.rpm = U.approach(car.rpm, target, (acc ? 5000 : 3800) * dt);
        car.throttle = acc ? 1 : 0;
        car.burn = U.approach(car.burn, acc && this.phase === 'count' && car.rpm > eng.red * 0.88 ? 1 : 0, dt * 3);
      }
      for (const car of this.cars) if (!car.isPlayer) car.rpm = car.model.eng.idle * 1.2;
    }

    launch() {
      for (const car of this.players) {
        car.lapStart = 0;
        if (car.autopilot) continue;
        const r = car.rpm / car.model.eng.red;
        if (car.inp && car.inp.accel) {
          if (r >= 0.55 && r <= 0.84) { car.speed = car.st.vmax * 0.24; car.perfect = true; this.emit('perfect', { car }); }
          else if (r > 0.9) { car.spinT = 1.1; this.emit('spin', { car }); }
        }
      }
      for (const car of this.cars) if (car.ai) car.speed = car.ai.vmax * 0.02;
    }

    gearTop(car, g) { return car.st.vmax * Math.pow(g / car.st.gears, 0.72); }

    stepPlayer(car, dt, inp) {
      const T = this.track, st = car.st;
      const seg = T.findSegment(car.z);
      if (car.finished && !car.autopilot) car.autopilot = true;

      // nitro y marchas manuales
      if (inp.nitro && car.nitroT <= 0 && car.nitroN > 0 && !car.finished) {
        car.nitroN--; car.nitroT = st.nitroDur; this.emit('nitro', { car });
      }
      const eng0 = car.model.eng;
      if (car.manual && !car.autopilot) {
        if (inp.up && car.gear < st.gears) {
          car.gear++; car.shiftT = st.shift * 0.7; car.shiftPuff = 0.07; this.emit('shift', { car });
          if (car.rpm > eng0.red * 0.8 && Math.random() < 0.45) { car.backfire = 0.08; this.emit('backfire', { car, soft: true }); }
        }
        if (inp.down && car.gear > 1) { car.gear--; car.shiftT = st.shift * 0.4; this.emit('shift', { car }); }
      }

      const grip = st.grip * (this.gripW + (1 - this.gripW) * st.tires * 0.18);
      let vmax = st.vmax;
      if (car.nitroT > 0) vmax *= st.nitroPow;
      if (car.draft > 0.5) vmax *= 1.05;

      // dirección: rampa progresiva, más suave cuanto más rápido (estabilidad)
      let target = inp.steerTarget != null ? inp.steerTarget : (inp.left ? -1 : 0) + (inp.right ? 1 : 0);
      const sp = car.speed / st.vmax;
      const hs = U.clamp((sp - 0.3) / 0.7, 0, 1);
      const reversing = target !== 0 && car.steer !== 0 && Math.sign(target) !== Math.sign(car.steer);
      const rate = target === 0 ? U.lerp(7.5, 5.6, hs) : reversing ? U.lerp(10, 7.2, hs) : U.lerp(5.2, 3.5, hs);
      car.steer = U.approach(car.steer, target, rate * dt);
      const auth = U.clamp(car.speed / (st.vmax * 0.22), 0, 1);
      const crashK = car.crashT > 0 ? 0.35 : 1;
      const drift = (seg.curve * sp * sp * C.CENTRI) / grip;
      // inercia lateral: el coche no se desplaza de golpe, sigue a la dirección con un pequeño retardo
      const want = car.steer * C.STEER * auth * crashK * (0.92 + 0.08 * grip) - drift;
      const resp = (car.offroad ? 6.5 : 10.5) * (0.88 + 0.12 * Math.min(1.5, grip));
      car.vx += (want - car.vx) * (1 - Math.exp(-resp * dt));
      car.x += car.vx * dt;
      // derrape: cuando la curva pide casi todo el agarre, o al frenar fuerte girando
      const turning = Math.abs(car.steer);
      const demand = Math.abs(drift) / (C.STEER * 0.95);
      let slipT = U.clamp((demand - 0.62) * 2.3, 0, 1) * U.clamp(sp * 1.5, 0, 1);
      if (turning > 0.6 && sp > 0.62) slipT = Math.max(slipT, (sp - 0.62) * 2.1 * turning * (Math.sign(car.steer) === Math.sign(seg.curve) ? 1 : 0.55));
      if (inp.brake && sp > 0.45) slipT = Math.max(slipT, (sp - 0.45) * (0.45 + turning) * 1.3);
      if (this.gripW < 1) slipT *= 1.15;
      car.slip = U.approach(car.slip, U.clamp(slipT, 0, 1), dt * (slipT > car.slip ? 5 : 2.5));
      if (car.slip > 0.3) car.speed -= car.slip * st.vmax * 0.035 * dt;
      car.offroad = Math.abs(car.x) > 1.0 + C.CAR_W * 0.25;

      // motor
      const eng = car.model.eng;
      const acc = !!inp.accel && !(car.finished && !car.autopilot);
      car.throttle = U.approach(car.throttle, acc ? 1 : 0, dt * 8);
      if (car.lastThr > 0.85 && car.throttle < 0.3 && car.rpm > eng.red * 0.66 && car.backfire <= 0) {
        if (Math.random() < 0.6) { car.backfire = 0.1; car.shiftPuff = 0.06; this.emit('backfire', { car }); }
      }
      car.lastThr = car.throttle > car.lastThr || car.throttle < 0.3 ? car.throttle : car.lastThr;
      if (car.backfire > 0) car.backfire -= dt;
      let a = st.accel * Math.max(0, 1 - Math.pow(car.speed / vmax, 2.2));
      if (car.manual) {
        const gt = this.gearTop(car, car.gear);
        const rn = car.speed / gt;
        if (rn >= 1) a = 0;
        else if (rn < 0.4 && car.gear > 1) a *= 0.3 + rn;
        a *= 1.05;
      }
      if (car.shiftT > 0) { car.shiftT -= dt; a *= 0.25; }
      if (car.fuel <= 0) a *= 0.28;
      if (car.nitroT > 0) a *= 2.1;
      if (car.draft > 0.5) a *= 1.12;
      if (car.spinT > 0) { car.spinT -= dt; a *= 0.45; }
      if (car.offroad) vmax = Math.min(vmax, st.vmax * (0.34 + st.tires * 0.035));
      if (inp.brake) {
        car.speed -= st.vmax * 0.62 * dt;
        car.braking = car.speed > 1;
      } else {
        car.braking = false;
        if (car.throttle > 0.05) car.speed += a * car.throttle * dt;
        else car.speed -= st.vmax * 0.1 * dt;
      }
      if (car.speed > vmax) car.speed = Math.max(vmax, car.speed - st.vmax * (car.offroad ? 1.1 : 0.3) * dt);
      const slope = (seg.p2.world.y - seg.p1.world.y) / C.SEG;
      car.speed -= slope * 900 * dt;
      car.speed = U.clamp(car.speed, 0, st.vmax * 1.6);

      // saltos en cambios de rasante
      const next = T.segments[(seg.index + 1) % T.N];
      const dSlope = (next.p2.world.y - next.p1.world.y) / C.SEG - slope;
      if (dSlope < -0.03 && sp > 0.55 && car.air <= 0 && car.airV <= 0) car.airV = -dSlope * car.speed * 1.4;
      if (car.air > 0 || car.airV > 0) {
        car.airV -= 2800 * dt;
        car.air += car.airV * dt;
        if (car.air <= 0) { car.air = 0; if (car.airV < -350) { this.emit('land', { car }); car.vis.heaveV -= 0.1; car.vis.pitchV -= 0.2; } car.airV = 0; }
      }

      // combustible
      if (!this.demo) {
        car.fuel -= this.fuelRate * st.fuelUse * (0.25 + car.throttle * 0.75) * (0.4 + 0.6 * Math.min(1, sp)) * dt;
        if (car.fuel < 0) car.fuel = 0;
        if (car.fuel < 20 && !car.lowFuelWarned) { car.lowFuelWarned = true; this.emit('lowfuel', { car }); }
        if (car.fuel > 30) car.lowFuelWarned = false;
      }
      if (car.nitroT > 0) car.nitroT -= dt;
      if (car.crashT > 0) car.crashT -= dt;

      // marchas automáticas y rpm
      if (!car.manual || car.autopilot) {
        if (car.shiftT <= 0) {
          const rn = car.speed / this.gearTop(car, car.gear);
          if (rn > 0.95 && car.gear < st.gears) {
            car.gear++; car.shiftT = st.shift; car.shiftPuff = 0.07; this.emit('shift', { car });
            if (car.throttle > 0.8 && Math.random() < 0.3) { car.backfire = 0.08; this.emit('backfire', { car, soft: true }); }
          }
          else if (car.gear > 1 && car.speed < this.gearTop(car, car.gear - 1) * 0.72) { car.gear--; car.shiftT = st.shift * 0.4; }
        }
      }
      const rn = U.clamp(car.speed / this.gearTop(car, car.gear), 0, 1.03);
      const rpmT = eng.idle + (eng.red - eng.idle) * rn;
      car.rpm = U.lerp(car.rpm, rpmT, 1 - Math.exp(-dt * (car.shiftT > 0 ? 30 : 16)));
      if (car.manual && rn >= 1 && acc) car.rpm = eng.red * (0.97 + Math.random() * 0.03);

      // rebufo
      const ahead = this.nearestAhead(car, 13 * C.SEG, 0.26);
      if (ahead && ahead.dz > C.SEG * 1.2 && car.speed > st.vmax * 0.5) car.draft = Math.min(1, car.draft + dt * 1.4);
      else car.draft = Math.max(0, car.draft - dt * 2);

      // avance
      const oldZ = car.z;
      car.z = U.increase(car.z, car.speed * dt, T.length);
      if (car.z < oldZ && car.speed > 0) this.lapCross(car);
      this.sceneryCollide(car, oldZ);
      this.pickupCheck(car, oldZ);
      if (Math.abs(car.x) > 3.2) { car.x = U.clamp(car.x, -3.2, 3.2); car.vx = 0; }
      car.steerVis = car.steer;
    }

    autoInput(car, dt) {
      const T = this.track, st = car.st;
      const seg = T.findSegment(car.z);
      let maxC = 0;
      const look = 10 + Math.floor(car.speed / C.SEG);
      for (let i = 2; i < look; i += 2) maxC = Math.max(maxC, Math.abs(T.segments[(seg.index + i) % T.N].curve));
      const grip = st.grip * this.gripW;
      const spMax = maxC > 0.1 ? Math.sqrt((0.7 * C.STEER * grip) / (maxC * C.CENTRI)) : 2;
      const vT = Math.min(this.demo ? 0.93 : 0.97, spMax) * st.vmax;
      car.apLaneT -= dt;
      const ahead = this.nearestAhead(car, 9 * C.SEG, 0.4);
      if (ahead && car.apLaneT <= 0 && car.speed > ahead.car.speed * 0.9) {
        const lane = this.freeLane(car);
        if (lane != null) { car.apLane = lane; car.apLaneT = 1.5; }
      }
      const sp = car.speed / st.vmax;
      const drift = (seg.curve * sp * sp * C.CENTRI) / grip;
      const auth = Math.max(0.15, U.clamp(car.speed / (st.vmax * 0.22), 0, 1));
      const need = (drift + (car.apLane - car.x) * 2.6) / (C.STEER * auth);
      return { accel: car.speed < vT * 0.99, brake: car.speed > vT * 1.1, steerTarget: U.clamp(need, -1, 1) };
    }

    nearestAhead(car, range, lat) {
      const L = this.track.length;
      let best = null, bd = range;
      for (let i = 0; i < this.cars.length; i++) {
        const o = this.cars[i];
        if (o === car) continue;
        let dz = o.z - car.z;
        if (dz < -L / 2) dz += L; else if (dz > L / 2) dz -= L;
        if (dz <= 0 || dz > bd) continue;
        if (Math.abs(o.x - car.x) > lat) continue;
        bd = dz; best = o;
      }
      return best ? { car: best, dz: bd } : null;
    }

    freeLane(car) {
      const L = this.track.length;
      const opts = LANES.slice().sort((a, b) => Math.abs(a - car.x) - Math.abs(b - car.x));
      for (const lane of opts) {
        if (Math.abs(lane - car.x) < 0.2) continue;
        let ok = true;
        for (let i = 0; i < this.cars.length && ok; i++) {
          const o = this.cars[i];
          if (o === car) continue;
          let dz = o.z - car.z;
          if (dz < -L / 2) dz += L; else if (dz > L / 2) dz -= L;
          if (dz > -3 * C.SEG && dz < 10 * C.SEG && Math.abs(o.x - lane) < C.CAR_W * 1.05) ok = false;
        }
        if (ok) return lane;
      }
      return null;
    }

    stepAI(car, dt) {
      const T = this.track, ai = car.ai, st = car.st;
      const seg = T.findSegment(car.z);
      const look = 12 + Math.floor((car.speed / C.SEG) * 0.9);
      let maxC = 0;
      for (let i = 2; i < look; i += 2) { const c = Math.abs(T.segments[(seg.index + i) % T.N].curve); if (c > maxC) maxC = c; }
      let target = ai.vmax;
      const snow = this.theme.weather === 'snow';
      const tol = ai.tol + (this.gripW < 1 ? (snow ? -0.9 : -0.6) : 0);
      if (maxC > tol) target *= Math.max(0.55, 1 - (maxC - tol) * ai.brakeK);
      if (this.gripW < 1) target *= snow ? 0.965 : 0.982;
      // errores ocasionales (más frecuentes en las primeras copas)
      if (ai.errT > 0) { ai.errT -= dt; target *= 0.88; }
      else if (this.phase === 'race' && maxC > 2 && Math.random() < ai.mistake * dt) ai.errT = U.rand(0.5, 1.2);
      target *= ai.rubber;
      if (car.nitroT > 0) target *= 1.14;
      if (car.finished) target *= 0.85;
      ai.laneT -= dt;
      // en niveles altos los mejores rivales defienden la posición cerrando el hueco
      if (ai.defT > 0) ai.defT -= dt;
      else if (ai.lvl > 0.35 && ai.skill > 0.45 && this.phase === 'race' && !car.finished) {
        const L = this.track.length;
        for (let i = 0; i < this.players.length; i++) {
          const p = this.players[i];
          let dz = car.z - p.z;
          if (dz < -L / 2) dz += L; else if (dz > L / 2) dz -= L;
          if (dz > C.SEG * 1.5 && dz < C.SEG * 6 && p.speed > car.speed * 1.01 && Math.random() < ai.lvl * 0.9 * dt) {
            ai.lane = U.clamp(p.x, -0.62, 0.62); ai.laneT = 1.1; ai.defT = U.rand(4, 7);
            break;
          }
        }
      }
      const ahead = this.nearestAhead(car, 8 * C.SEG, C.CAR_W * 1.1);
      if (ahead) {
        if (ai.laneT <= 0 && ahead.car.speed < car.speed * 1.02) {
          const lane = this.freeLane(car);
          if (lane != null) { ai.lane = lane; ai.laneT = 1.3 + Math.random(); }
          else ai.laneT = 0.4;
        }
        if (ahead.dz < 3.5 * C.SEG && Math.abs(ahead.car.x - car.x) < C.CAR_W * 0.98) target = Math.min(target, ahead.car.speed * 0.98);
      }
      const a = st.accel * Math.max(0.06, 1 - Math.pow(car.speed / (ai.vmax * 1.25), 2));
      if (car.speed < target) car.speed = Math.min(target, car.speed + a * dt);
      else car.speed = Math.max(target, car.speed - st.vmax * 0.55 * dt);
      car.braking = car.speed > target + 40 || target < ai.vmax * ai.rubber * 0.9;
      car.throttle = car.speed < target - 20 ? 1 : 0.35;
      const tx = U.clamp(ai.lane + ai.jitter, -0.8, 0.8);
      const dx = tx - car.x;
      const mv = Math.sign(dx) * Math.min(Math.abs(dx), ai.lat * dt);
      car.x += mv;
      car.steerVis = U.approach(car.steerVis, U.clamp(dx * 4, -1, 1), dt * 5);
      if (ai.nitroN > 0 && this.phase === 'race' && car.lapsDone >= 1 && maxC < 1 && car.speed > ai.vmax * 0.8 && Math.random() < dt * 0.08) {
        ai.nitroN--; car.nitroT = 2.2;
      }
      if (car.nitroT > 0) car.nitroT -= dt;
      if (car.backfire > 0) car.backfire -= dt;
      if (car.bumpSmoke > 0) car.bumpSmoke = Math.max(0, car.bumpSmoke - dt * 1.5);
      const gt = this.gearTop(car, car.gear);
      if (car.speed > gt * 0.95 && car.gear < st.gears) { car.gear++; car.shiftPuff = 0.05; if (Math.random() < 0.12) car.backfire = 0.07; }
      else if (car.gear > 1 && car.speed < this.gearTop(car, car.gear - 1) * 0.72) car.gear--;
      car.rpm = car.model.eng.idle + (car.model.eng.red - car.model.eng.idle) * U.clamp(car.speed / this.gearTop(car, car.gear), 0, 1);
      const oldZ = car.z;
      car.z = U.increase(car.z, car.speed * dt, T.length);
      if (car.z < oldZ) this.lapCross(car);
    }

    lapCross(car) {
      car.lapsDone++;
      if (car.lapsDone >= 1 && !car.finished) {
        const lt = this.time - car.lapStart;
        car.laps.push(lt);
        car.lastLap = lt;
        const best = car.bestLap == null || lt < car.bestLap;
        if (best) car.bestLap = lt;
        if (car.isPlayer) this.emit('lap', { car, time: lt, best });

          }

      const sorted = this.cars.slice().sort((a, b) => {
        if (a.finished && b.finished) return a.finishTime - b.finishTime;
        if (a.finished) return -1;
        if (b.finished) return 1;

      });
      for (let i = 0; i < sorted.length; i++) {
        const c = sorted[i];

        }

    }

    updateRubber() {
      if (this.demo || !this.players.length) return;

      const L = this.track.length;
      const list = this.cars.map((c) => {
        let t = c.finished ? c.finishTime : null;
        if (t == null) {
          const remain = Math.max(0, this.laps * L - c.progress);
          const v = c.ai ? c.ai.vmax * 0.9 : Math.max(c.speed, c.st.vmax * 0.5);
          t = this.time + remain / Math.max(1, v);
        }

      list.sort((a, b) => a.time - b.time);
      return list.map((r, i) => ({
        pos: i + 1, name: r.car.name, model: r.car.model, color: r.car.color, time: r.time, finished: r.car.finished,

    ctx.save();
    if (cam.shake > 0) ctx.translate((Math.random() - 0.5) * cam.shake * vh * 0.018, (Math.random() - 0.5) * cam.shake * vh * 0.018);

    R.background(ctx, race, v, vw, vh, horizon);

    // ---------- carretera
    const pal = R.palette(theme);
    let x = 0, dx = -(base.curve * basePct), maxy = vh;
    const fogD = theme.fogD;
    for (let n = 0; n < dd; n++) {
      const seg = segs[(base.index + n) % N];
      const looped = seg.index < base.index;
      const cz = camZ - (looped ? L : 0);
      seg.fogI = Math.min(63, Math.round((1 - U.expFog(n / dd, fogD)) * 63));
      seg.clip = maxy;
      proj(seg.p1, camX - x, camY, cz, depth, vw, horizon, K);
      proj(seg.p2, camX - x - dx, camY, cz, depth, vw, horizon, K);
      seg.dxv = dx;
      x += dx; dx += seg.curve;
      seg.vis = seg.p1.camera.z > depth;
      if (seg.p1.camera.z <= depth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
      seg.drawn = R.fid;
      R.segment(ctx, vw, seg, maxy, pal, theme);
      maxy = seg.p2.screen.y;
    }

    R.drawSkids(ctx, race, v, K);
    R.bucket(race, N);

    // ---------- sprites, objetos y coches (de lejos a cerca)
    const night = theme.ambient < 0.75;
    const lampsOn = theme.lamps;
    const wet = theme.wet;
    const fx = Art.fx();
    const glowLamp = Art.glow('#ffd79a');
    const RW = C.ROAD_W;
    const dK = depth * K;
    R.liveLeft = R.liveBudget();
    for (let n = dd - 1; n > 0; n--) {
      const seg = segs[(base.index + n) % N];
      if (!seg.vis) continue;
      const s1 = seg.p1.screen;
      const scale = s1.scale;
      const fogA = seg.fogI / 63;
      const sprs = seg.sprites;
      for (let i = 0; i < sprs.length; i++) {
        const sp = sprs[i];
        const def = race.sprites[sp.name];
        if (!def) continue;
        const w = def.w * scale * K;
        if (w < 1.2) continue;
        const h = w * def.aspect;
        const ax = def.ax != null ? def.ax : sp.offset < 0 ? 1 : 0;
        const sx = s1.x + scale * sp.offset * RW * K - w * ax;
        if (sx > vw || sx + w < 0) continue;
        const sy = s1.y - h;
        const full = R.sprite(ctx, def, sx, sy, w, h, seg.clip, fogA);
        if (lampsOn && def.light && full && fogA < 0.9) {
          ctx.globalCompositeOperation = 'lighter';
          for (let j = 0; j < def.light.length; j++) {
            const Lt = def.light[j];
            const lx = sx + Lt[0] * w, ly = sy + Lt[1] * h, r = w * 0.32 * Lt[2];
            ctx.globalAlpha = 0.85 * (1 - fogA);
            ctx.drawImage(glowLamp, lx - r, ly - r, r * 2, r * 2);
            if (Lt[3] === 'lamp' && def.ax != null) {
              const pw = w * 0.9, ph = pw * 0.22;
              ctx.globalAlpha = 0.3 * (1 - fogA);
              ctx.drawImage(glowLamp, lx - pw / 2, s1.y - ph / 2, pw, ph);
              if (wet) { ctx.globalAlpha = 0.28 * (1 - fogA); ctx.drawImage(R.tinted(fx.streak, '#ffd79a'), lx - w * 0.03, s1.y, w * 0.06, (s1.y - ly) * 0.8); }
            }
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
        }
      }
      // objetos recogibles
      const pks = seg.pickups;
      for (let i = 0; i < pks.length; i++) {
        const pk = pks[i];
        if (pk.taken[p.pIndex] === p.lapsDone && !race.demo) continue;
        if (race.demo && pk.type !== 'fuel' && pk.type !== 'nitro') continue;
        const def = race.sprites[pk.type];
        if (!def) continue;
        const w = def.w * scale * K;
        if (w < 1.5) continue;
        const h = w * def.aspect;
        const bob = Math.sin(R.t * 3.2 + pk.spin) * h * 0.1;
        const cx = s1.x + scale * pk.x * RW * K;
        const sy = s1.y - h * 1.35 - bob;
        if (sy + h > seg.clip) continue;
        const spin = pk.type === 'coin' ? Math.max(0.12, Math.abs(Math.cos(R.t * 3 + pk.spin))) : 1;
        ctx.globalAlpha = 1 - fogA * 0.8;
        ctx.drawImage(def.img, cx - (w * spin) / 2, sy, w * spin, h);
        ctx.globalAlpha = 1;
        ctx.globalAlpha = 0.35 * (1 - fogA);
        ctx.drawImage(fx.shadow, cx - w * 0.4, s1.y - w * 0.06, w * 0.8, w * 0.12);
        ctx.globalAlpha = 1;
      }
      // coches
      const cars = seg.cars;
      for (let i = 0; i < cars.length; i++) {
        const car = cars[i];
        let dz = car.z - camZ;
        if (dz < 0) dz += L;
        if (dz < 340 || dz > dd * C.SEG) continue;
        const s2 = seg.p2.screen;
        const pct = U.percentRemaining(car.z, C.SEG);
        const sc = U.lerp(s1.scale, s2.scale, pct);
        const rx = U.lerp(s1.x, s2.x, pct);
        const ry = U.lerp(s1.y, s2.y, pct);
        const hw = U.lerp(s1.w, s2.w, pct);
        const cxs = rx + car.x * hw;
        // guiñada aparente = rumbo de la carretera + rumbo propio − ángulo de visión
        const vis = car.vis || ZV;
        // el coche propio lo manda su rumbo (morro hacia donde se gira); la perspectiva lateral apenas influye
        const own = car === p;
        const yaw = Math.atan(seg.dxv / C.SEG) * (own ? 0.5 : 1) + vis.yaw - Math.atan((cxs - vw / 2) / dK) * (own ? 0.15 : 1);
        const ratio = Math.max(0, (ry - horizon) / dK);
        R.car(ctx, race, v, car, cxs, ry, sc * K, seg.clip, fogA, car === p, night, wet, vw, horizon, yaw,
          U.clamp(0.03 + 0.11 * ratio, 0.03, 0.14), 2.4 + 3 * Math.max(0, 1 - ratio));
      }
      if (R.pb[seg.index]) R.drawParts(ctx, race, R.pb[seg.index], seg, K, fogA, vh);
    }
    R.unbucket(race);

    R.particles(ctx, race, v, dt, vw, vh);
    R.weather(ctx, race, v, dt, vw, vh, horizon);
    R.post(ctx, race, v, vw, vh, horizon, dt);
    ctx.restore(); // shake
    if (!race.demo && TG.HUD) TG.HUD.draw(ctx, race, v, vw, vh, dt);
    ctx.restore();
  };

  R.background = function (ctx, race, v, vw, vh, horizon) {
    const theme = race.theme;
    ctx.drawImage(Art.sky(theme, vw, vh, horizon), 0, 0);
    const offPx = v.skyOff * vw * 2;
    const body = theme.sun || theme.moon;
    if (body) {
      const P = vw * 3;
      let sx = body.x * vw - offPx;
      sx = ((sx % P) + P) % P;
      if (sx > vw * 1.6) sx -= P;
      const sy = horizon * body.y;
      const r = vh * body.r;
      if (sx > -vh * 0.6 && sx < vw + vh * 0.6) {
        if (theme.sun) {
          ctx.fillStyle = U.rad(ctx, sx, sy, 0, vh * 0.55, [0, U.rgba(body.glow, (body.a || 0.5) * 0.55), 0.35, U.rgba(body.glow, (body.a || 0.5) * 0.18), 1, U.rgba(body.glow, 0)]);
          ctx.fillRect(sx - vh * 0.55, sy - vh * 0.55, vh * 1.1, vh * 1.1);
          ctx.fillStyle = U.rad(ctx, sx, sy, r * 0.6, r * 2.4, [0, U.rgba('#ffffff', 0.9), 1, U.rgba(body.glow, 0)]);
          ctx.fillRect(sx - r * 2.4, sy - r * 2.4, r * 4.8, r * 4.8);
          ctx.fillStyle = body.c;
          ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
          v.sunX = sx; v.sunY = sy;
        } else {
          ctx.fillStyle = U.rad(ctx, sx, sy, 0, r * 7, [0, 'rgba(220,235,255,0.35)', 1, 'rgba(220,235,255,0)']);
          ctx.fillRect(sx - r * 7, sy - r * 7, r * 14, r * 14);
          ctx.fillStyle = U.rad(ctx, sx - r * 0.3, sy - r * 0.3, 0, r * 1.2, [0, '#ffffff', 1, body.c]);
          ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(160,170,190,0.35)';
          [[0.3, -0.2, 0.22], [-0.3, 0.25, 0.16], [0.1, 0.45, 0.12]].forEach((c) => { ctx.beginPath(); ctx.arc(sx + c[0] * r, sy + c[1] * r, c[2] * r, 0, Math.PI * 2); ctx.fill(); });
          v.sunX = null;
        }
      } else v.sunX = null;
    } else v.sunX = null;
    if (theme.aurora) {
      const fx = Art.fx();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (let b = 0; b < 3; b++) {
        const baseY = horizon * (0.22 + b * 0.13);
        for (let x = 0; x < vw; x += 5 * R.dpr) {
          const t = R.t * 0.25 + b * 2.1;
          const wx = x + offPx * 0.6;
          const y = baseY + Math.sin(wx * 0.0035 + t + b) * horizon * 0.07 + Math.sin(wx * 0.009 - t * 1.4) * horizon * 0.03;
          const h = horizon * (0.16 + 0.1 * Math.sin(wx * 0.005 + t * 0.8));
          ctx.globalAlpha = Math.max(0, 0.12 + 0.1 * Math.sin(wx * 0.012 + t * 2.3)) * (1 - b * 0.25);
          ctx.drawImage(fx.aurora, x, y - h, 5 * R.dpr + 1, h);
        }
      }
      ctx.restore();
    }
    const Ls = race.layers;
    if (Ls.clouds) {
      const img = Ls.clouds.img;
      const dh = vh * 0.32, dw = img.width * (dh / img.height);
      const y = horizon * Ls.clouds.y - dh * 0.5;
      const x0 = -((((offPx * 0.7 + R.t * vw * 0.004) % dw) + dw) % dw);
      for (let x = x0; x < vw; x += dw) ctx.drawImage(img, x, y, dw + 1, dh);
    }
    for (let i = 0; i < Ls.length; i++) {
      const Ly = Ls[i];
      const dh = vh * Ly.h;
      const dw = Ly.img.width * (dh / Ly.img.height);
      const y = horizon - dh + 1;
      const x0 = -((((offPx * Ly.par) % dw) + dw) % dw);
      for (let x = x0; x < vw; x += dw) ctx.drawImage(Ly.img, x, y, dw + 1, dh);
    }
    ctx.fillStyle = U.lin(ctx, 0, horizon - vh * 0.07, 0, horizon + 2, [0, U.rgba(theme.fog, 0), 1, U.rgba(theme.fog, 0.9)]);
    ctx.fillRect(0, horizon - vh * 0.07, vw, vh * 0.07 + 2);
    ctx.fillStyle = theme.fog;
    ctx.fillRect(0, horizon, vw, vh - horizon);
  };

  R.car = function (ctx, race, v, car, cx, cy, sK, clipY, fogA, isView, night, wet, vw, horizon, yaw, cpitch, cdist) {
    const ppl = CAR_UNITS * sK;
    const wpx = ppl * 0.43;
    if (wpx < 1.5 || !car.c3) return;
    if (cy - ppl * 0.34 > clipY) return;
    const vis = car.vis || ZV;
    const fx = Art.fx();
    const alpha = (1 - fogA * 0.85) * (car.ghost ? 0.42 : 1);
    const lift = car.air * sK;
    // faros del coche del jugador (noche)
    if (isView && night && race.theme.headlights) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55;
      const topY = horizon + (cy - horizon) * 0.1;
      const botY = cy - ppl * 0.16;
      const bw = wpx * 2.2;
      ctx.drawImage(fx.cone, cx - bw / 2, topY, bw, botY - topY);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    const needClip = cy + 2 > clipY;
    if (needClip) { ctx.save(); ctx.beginPath(); ctx.rect(-10, -10, vw + 20, clipY + 10); ctx.clip(); }
    const live = isView || (!car.ghost && R.liveLeft > 0 && wpx > R.sprW);
    let lights, exh, s = 1, lx = 0, ly = 0;
    if (live) {
      if (!isView) R.liveLeft--;
      const shake = isView && car.crashT > 0 ? Math.sin(R.t * 50) * 0.02 : 0;
      const m = C3.draw(ctx, car.model, car.c3.tex, race.env3d,
        { yaw: yaw + shake, roll: vis.roll, pitch: vis.pitch, heave: vis.heave, steer: vis.steer, blur: vis.blur },
        { x: cx, y: cy, ppl, pitch: cpitch, dist: cdist, lift, alpha, lod: isView ? 0 : 1, shadow: car.ghost ? 0 : 0.62 * (1 - Math.min(0.6, car.air / 500)) });
      lights = m.lights; exh = m.exh;
      if (isView) v.carScreen = { x: cx, y: cy - lift, w: wpx, h: ppl * 0.3, exh };
    } else {
      const idx = U.clamp(Math.round(yaw / YAW_STEP), -YAW_MAX, YAW_MAX);
      const f = R.carFrame(car, idx);
      s = ppl / f.ppl;
      lx = cx; ly = cy - lift;
      ctx.globalAlpha = alpha;
      const rot = vis.roll * 0.7;
      if (rot) {
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(rot);
        ctx.drawImage(f.img, -f.ax * s, -f.ay * s, f.img.width * s, f.img.height * s);
        ctx.restore();
      } else ctx.drawImage(f.img, lx - f.ax * s, ly - f.ay * s, f.img.width * s, f.img.height * s);
      ctx.globalAlpha = 1;
      lights = f.lights; exh = f.exh;
    }
    if (needClip) ctx.restore();
    if (car.ghost || cy - ppl * 0.12 > clipY) return;
    const P = (L) => (live ? L : [lx + L[0] * s, ly + L[1] * s, L[2] * s]);
    // luces traseras / freno
    const brake = car.braking;
    if (night || brake) {
      ctx.globalCompositeOperation = 'lighter';
      const g = Art.glow('#ff2438');
      const a0 = (brake ? 0.95 : 0.5) * alpha;
      for (let i = 0; i < lights.length; i++) {
        const Lt = P(lights[i]);
        const r = Lt[2] * (brake ? 2.6 : 1.8);
        ctx.globalAlpha = a0;
        ctx.drawImage(g, Lt[0] - r, Lt[1] - r, r * 2, r * 2);
        if (wet && night) {
          ctx.globalAlpha = 0.22 * alpha;
          ctx.drawImage(R.tinted(fx.streak, '#ff3040'), Lt[0] - r * 0.2, cy, r * 0.4, wpx * 0.45);
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // llamas: nitro (azul) y petardeo (naranja)
    const bf = car.backfire > 0;
    if (car.nitroT > 0 || bf) {
      ctx.globalCompositeOperation = 'lighter';
      const gb = Art.glow(bf && car.nitroT <= 0 ? '#ff8a2a' : '#3a8aff');
      const flame = bf && car.nitroT <= 0 ? R.tinted(fx.flame, '#ffb050') : fx.flame;
      for (let i = 0; i < exh.length; i++) {
        const E = P(exh[i]);
        const wid = Math.max(2, E[2] * 2.6);
        const len = wpx * (bf && car.nitroT <= 0 ? 0.05 + Math.random() * 0.06 : 0.14 + Math.random() * 0.1);
        ctx.globalAlpha = 0.85 * alpha;
        ctx.drawImage(gb, E[0] - wid * 1.8, E[1] - wid * 1.8, wid * 3.6, wid * 3.6);
        ctx.drawImage(flame, E[0] - wid / 2, E[1] - wid * 0.2, wid, len);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  };

  /* ---------- Humo y polvo en el mundo (perspectiva real) ---------- */
  R.partCap = () => ({ low: 140, medium: 240, high: 360, ultra: 480 }[R.quality()] || 360);
  R.puff = function (race, o) {
    const P = race.fx.parts;
    if (P.length >= R.partCap()) return;
    o.max = o.life;
    P.push(o);
  };
  R.fxUpdate = function (race, dt) {
    const fx = race.fx;
    if (!dt) return;
    const L = race.track.length;
    const th = race.theme;
    const wet = th.wet || th.weather === 'rain';
    const snowy = th.weather === 'snow';
    const dustC = U.lum(th.grass[0]) > 0.72 ? '#ffffff' : U.mix(th.grass[1], '#c8b89a', 0.35);
    // el humo se tiñe con la luz del escenario (más oscuro y azulado de noche)
    const dim = (c) => (th.ambient >= 0.95 ? c : U.mix(c, th.shade, (1 - th.ambient) * 0.75));
    const smokeC = dim('#eceef2'), exhC = dim('#c9ccd4'), exhD = dim('#6c6f78'), sprayC = dim(snowy ? '#f4f8ff' : '#c4cfdc');
    const players = race.players;
    const running = race.phase !== 'intro' && !race.demo;
    for (let i = 0; i < race.cars.length; i++) {
      const c = race.cars[i];
      if (!c.c3) continue;
      // solo cerca de algún jugador
      let near = false;
      for (let j = 0; j < players.length && !near; j++) {
        let dz = c.z - players[j].z;
        if (dz > L / 2) dz -= L; else if (dz < -L / 2) dz += L;
        if (dz > -2500 && dz < 14000) near = true;
      }
      if (!near) continue;
      const sp = c.speed / c.st.vmax;
      const E = c.c3;
      // escape: ralentí, aceleración fuerte, cambios y petardeos
      if (race.phase !== 'intro' || c.isPlayer) {
        let rate = 1.2;
        if (c.speed < c.st.vmax * 0.06) rate = 7;
        else if (c.throttle > 0.6 && sp < 0.45) rate = 10 * (1 - sp);
        if (c.shiftPuff > 0) { rate += 40; c.shiftPuff -= dt; }
        const dark = c.speed < c.st.vmax * 0.06 ? 0.3 : c.throttle > 0.6 && sp < 0.45 ? 0.55 : 0.25;
        c.exAcc = (c.exAcc || 0) + rate * dt * (c.isPlayer ? 1 : 0.6);
        while (c.exAcc >= 1) {
          c.exAcc -= 1;
          const e = U.pick(E.exh);
          if (!e) break;
          R.puff(race, { k: 's', z: c.z - 30, x: c.x + e.x, h: e.h, vz: c.speed * 0.72 + U.rand(-60, 60), vx: U.rand(-0.05, 0.05), vh: U.rand(40, 120), s: U.rand(80, 120), gs: U.rand(280, 460), life: U.rand(0.7, 1.2), c: dark > 0.5 ? exhD : exhC, a: dark * (c.isPlayer ? 0.8 : 0.6), drag: 1.6 });
        }
      }
      // humo de neumáticos al derrapar o patinar
      const slip = c.isPlayer ? Math.max(c.slip, c.spinT > 0 ? 1 : 0, c.burn || 0) : c.bumpSmoke || 0;
      if (slip > 0.22 && !c.offroad && c.air <= 0) {
        c.tsAcc = (c.tsAcc || 0) + (12 + slip * 40) * dt;
        while (c.tsAcc >= 1) {
          c.tsAcc -= 1;
          const sd = Math.random() < 0.5 ? -1 : 1;
          const vz = c.speed * U.rand(0.8, 0.97);
          R.puff(race, { k: 's', z: c.z + E.rearZ * U.rand(0.7, 1.1), x: c.x + sd * E.wheelX * U.rand(1, 1.45), h: U.rand(30, 110), vz, vx: sd * U.rand(0.12, 0.55), vh: U.rand(150, 360), s: U.rand(240, 380), gs: U.rand(900, 1400), life: U.rand(1, 1.7), c: smokeC, a: 0.55 + 0.3 * Math.min(1, slip), drag: 1.5 });
        }
      }
      // polvo fuera de pista
      if (c.offroad && c.speed > 250) {
        c.duAcc = (c.duAcc || 0) + 30 * Math.min(1, sp * 1.5) * dt;
        while (c.duAcc >= 1) {
          c.duAcc -= 1;
          const sd = Math.random() < 0.5 ? -1 : 1;
          R.puff(race, { k: 's', z: c.z + E.rearZ * U.rand(0.3, 1.1), x: c.x + sd * E.wheelX * U.rand(0.8, 1.3), h: U.rand(10, 60), vz: c.speed * U.rand(0.4, 0.7), vx: sd * U.rand(0.1, 0.5), vh: U.rand(60, 260), s: U.rand(160, 260), gs: U.rand(600, 1000), life: U.rand(0.5, 0.9), c: dustC, a: 0.7, drag: 1.8 });
        }
      }
      // agua o nieve levantada por las ruedas
      if ((wet || snowy) && sp > 0.3 && running) {
        c.wtAcc = (c.wtAcc || 0) + (c.isPlayer ? 26 : 16) * sp * dt;
        while (c.wtAcc >= 1) {
          c.wtAcc -= 1;
          const sd = Math.random() < 0.5 ? -1 : 1;
          R.puff(race, { k: 's', z: c.z + U.rand(-20, 120), x: c.x + sd * E.wheelX * U.rand(0.85, 1.15), h: U.rand(10, 50), vz: c.speed * U.rand(0.72, 0.9), vx: sd * U.rand(0.02, 0.2), vh: U.rand(100, 260), s: U.rand(110, 170), gs: U.rand(500, 900), life: U.rand(0.3, 0.5), c: sprayC, a: (snowy ? 0.3 : 0.2) * sp, drag: 2.4 });
        }
      }
    }
    // integración
    const P = fx.parts;
    for (let i = P.length - 1; i >= 0; i--) {
      const o = P[i];
      o.life -= dt;
      if (o.life <= 0) { P[i] = P[P.length - 1]; P.pop(); continue; }
      o.z = U.increase(o.z, o.vz * dt, L);
      o.vz *= Math.exp(-o.drag * dt);
      o.x += o.vx * dt;
      o.h += o.vh * dt;
      o.vh *= Math.exp(-1.2 * dt);
      o.s += o.gs * dt;
    }
    // marcas de frenada de los jugadores
    for (let j = 0; j < players.length; j++) {
      const c = players[j];
      if (!c.c3) continue;
      const on = (c.slip > 0.34 || c.spinT > 0 || c.burn > 0.3) && !c.offroad && c.air <= 0 && c.speed > 120;
      c.skidOn = on ? c.skidOn : null;
      if (!on) continue;
      const z = U.increase(c.z, c.c3.rearZ, L);
      if (!c.skidOn) {
        c.skidOn = [{ pts: [], t: race.time }, { pts: [], t: race.time }];
        fx.skids.push(c.skidOn[0], c.skidOn[1]);
        while (fx.skids.length > 60) fx.skids.shift();
      }
      const last = c.skidOn[0].pts[c.skidOn[0].pts.length - 1];
      if (last) { let d = z - last.z; if (d < 0) d += L; if (d < 70) continue; }
      const a = Math.min(1, Math.max(c.slip, c.spinT > 0 ? 1 : 0, c.burn || 0));
      c.skidOn[0].pts.push({ z, x: c.x - c.c3.wheelX, a });
      c.skidOn[1].pts.push({ z, x: c.x + c.c3.wheelX, a });
      if (c.skidOn[0].pts.length > 160) c.skidOn = null;
    }
  };
  // reparte las partículas por segmento para dibujarlas en orden de profundidad
  R.pb = [];
  R.bucket = function (race, N) {
    if (R.pb.length !== N) { R.pb = new Array(N); }
    const P = race.fx ? race.fx.parts : [];
    for (let i = 0; i < P.length; i++) {
      const idx = Math.floor(P[i].z / C.SEG) % N;
      (R.pb[idx] || (R.pb[idx] = [])).push(P[i]);
    }
  };
  R.unbucket = function (race) {
    const P = race.fx ? race.fx.parts : [];
    const N = R.pb.length;
    for (let i = 0; i < P.length; i++) { const b = R.pb[Math.floor(P[i].z / C.SEG) % N]; if (b) b.length = 0; }
  };
  R.drawParts = function (ctx, race, list, seg, K, fogA, vh) {
    if (!seg.vis) return;
    const s1 = seg.p1.screen, s2 = seg.p2.screen, L = race.track.length;
    const fx = Art.fx();
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      let t = (o.z - seg.p1.world.z) / C.SEG;
      if (t < 0) t += L / C.SEG;
      if (t > 1) t = 1;
      const sc = s1.scale + (s2.scale - s1.scale) * t;
      const size = o.s * sc * K;
      if (size < 1.5) continue;
      const sx = s1.x + (s2.x - s1.x) * t + o.x * (s1.w + (s2.w - s1.w) * t);
      const sy = s1.y + (s2.y - s1.y) * t - o.h * sc * K;
      const lf = o.life / o.max;
      let a = o.a * lf * (1 - fogA * 0.9);
      if (size > vh * 0.32) a *= Math.max(0, 1 - (size - vh * 0.32) / (vh * 0.45));
      if (a < 0.01) continue;
      ctx.globalAlpha = Math.min(1, a * (lf > 0.85 ? (1 - lf) / 0.15 : 1));
      ctx.drawImage(R.tinted(fx.smoke, o.c), sx - size / 2, sy - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
  };
  // marcas de neumático sobre el asfalto
  R.drawSkids = function (ctx, race, v, K) {
    const fx = race.fx;
    if (!fx || !fx.skids.length) return;
    const T = race.track, L = T.length;
    ctx.fillStyle = '#141416';
    for (let k = 0; k < fx.skids.length; k++) {
      const st = fx.skids[k];
      const age = race.time - st.t;
      const fade = age > 25 ? Math.max(0, 1 - (age - 25) / 15) : 1;
      if (fade <= 0) continue;
      const pts = st.pts;
      let pa = null;
      for (let i = 0; i < pts.length; i++) {
        const q = pts[i];
        const seg = T.segments[Math.floor(q.z / C.SEG) % T.N];
        if (seg.drawn !== R.fid) { pa = null; continue; }
        let t = (q.z - seg.p1.world.z) / C.SEG;
        if (t < 0) t += L / C.SEG;
        const s1 = seg.p1.screen, s2 = seg.p2.screen;
        const w = s1.w + (s2.w - s1.w) * t;
        const pb = { x: s1.x + (s2.x - s1.x) * t + q.x * w, y: s1.y + (s2.y - s1.y) * t, w: w * 0.028, a: q.a };
        if (pa && pa.y > pb.y) {
          ctx.globalAlpha = 0.42 * fade * Math.min(pa.a, pb.a);
          ctx.beginPath();
          ctx.moveTo(pa.x - pa.w, pa.y); ctx.lineTo(pa.x + pa.w, pa.y);
          ctx.lineTo(pb.x + pb.w, pb.y); ctx.lineTo(pb.x - pb.w, pb.y);
          ctx.closePath(); ctx.fill();
        }
        pa = pb;
      }
    }
    ctx.globalAlpha = 1;
  };

  /* ---------- Partículas ---------- */
  R.spawn = function (v, o) {
    if (v.parts.length > 420) return;
    o.max = o.life;
    v.parts.push(o);
  };
  R.burst = function (v, kind, n) {
    const cs = v.carScreen;
    if (!cs) return;
    const u = cs.w;
    for (let i = 0; i < (n || 20); i++) {
      if (kind === 'spark') R.spawn(v, { k: 'spark', x: cs.x + U.rand(-0.4, 0.4) * u, y: cs.y - cs.h * 0.4, vx: U.rand(-1, 1) * u * 3, vy: U.rand(-1.8, 0.2) * u * 2, g: u * 6, life: U.rand(0.25, 0.6), s: u * 0.01 });
      else if (kind === 'coin') R.spawn(v, { k: 'spark', c: '#ffe066', x: cs.x + U.rand(-0.2, 0.2) * u, y: cs.y - cs.h * 0.6, vx: U.rand(-1, 1) * u * 1.5, vy: U.rand(-2, -0.5) * u, g: u * 3, life: U.rand(0.3, 0.6), s: u * 0.012 });
      else if (kind === 'nitro') R.spawn(v, { k: 'spark', c: '#7fd0ff', x: cs.x + U.rand(-0.3, 0.3) * u, y: cs.y - cs.h * 0.3, vx: U.rand(-1, 1) * u * 1.2, vy: U.rand(0, 1.5) * u, g: u, life: U.rand(0.2, 0.5), s: u * 0.01 });
      else if (kind === 'smoke') R.spawn(v, { k: 'smoke', c: '#e8e8e8', x: cs.x + U.rand(-0.45, 0.45) * u, y: cs.y - u * 0.04, vx: U.rand(-0.5, 0.5) * u, vy: U.rand(0.1, 0.6) * u, life: U.rand(0.5, 1), s: u * 0.3, gr: u * 0.8, a: 0.5 });
      else if (kind === 'confetti') R.spawn(v, { k: 'conf', c: U.pick(['#ff7a1a', '#7fcbe8', '#ffd21f', '#ff3c8e', '#ffffff']), x: U.rand(0, v.vw), y: U.rand(-v.vh * 0.3, 0), vx: U.rand(-40, 40), vy: U.rand(80, 220) * R.dpr, life: U.rand(2.5, 4), s: U.rand(5, 10) * R.dpr, r: U.rand(0, 6) });
    }
  };
  R.particles = function (ctx, race, v, dt, vw, vh) {
    const p = v.player, cs = v.carScreen;
    if (cs && !race.demo && race.phase !== 'intro') {
      const u = cs.w;
      const sp = p.speed / p.st.vmax;
      if (p.nitroT > 0 && cs.exh && Math.random() < 0.7) {
        const e = U.pick(cs.exh);
        if (e) R.spawn(v, { k: 'spark', c: '#8fd8ff', x: e[0] + U.rand(-2, 2), y: e[1], vx: U.rand(-0.4, 0.4) * u, vy: U.rand(0.8, 1.8) * u, g: u, life: U.rand(0.12, 0.3), s: u * 0.008 });
      }
    }
    const parts = v.parts;
    const fx = Art.fx();
    for (let i = parts.length - 1; i >= 0; i--) {
      const o = parts[i];
      o.life -= dt;
      if (o.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      o.x += o.vx * dt; o.y += o.vy * dt;
      if (o.g) o.vy += o.g * dt;
      if (o.gr) o.s += o.gr * dt;
      const t = o.life / o.max;
      if (o.k === 'smoke') {
        ctx.globalAlpha = (o.a || 0.5) * t;
        const img = R.tinted(fx.smoke, o.c || '#ffffff');
        ctx.drawImage(img, o.x - o.s / 2, o.y - o.s / 2, o.s, o.s);
      } else if (o.k === 'spark') {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.min(1, t * 1.5);
        ctx.strokeStyle = o.c || '#ffc24a';
        ctx.lineWidth = Math.max(1, o.s);
        ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - o.vx * 0.03, o.y - o.vy * 0.03); ctx.stroke();
        ctx.globalCompositeOperation = 'source-over';
      } else if (o.k === 'conf') {
        ctx.globalAlpha = Math.min(1, t * 2);
        ctx.fillStyle = o.c;
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.r + R.t * 4); ctx.fillRect(-o.s / 2, -o.s / 4, o.s, o.s / 2); ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  };

  /* ---------- Clima ---------- */
  R.weather = function (ctx, race, v, dt, vw, vh, horizon) {
    const th = race.theme, p = v.player;
    const sp = Math.min(1.4, p.speed / p.st.vmax);
    if (th.weather === 'rain') {
      if (!v.rain) { v.rain = []; for (let i = 0; i < 170; i++) v.rain.push({ x: Math.random(), y: Math.random(), l: U.rand(0.03, 0.07), s: U.rand(1.1, 1.8) }); }
      ctx.strokeStyle = 'rgba(200,214,236,0.38)';
      ctx.lineWidth = 1.3 * R.dpr;
      ctx.beginPath();
      for (const d of v.rain) {
        d.y += d.s * dt * (1 + sp * 0.6);
        d.x += (d.x - 0.5) * dt * sp * 1.2;
        if (d.y > 1.05 || d.x < -0.05 || d.x > 1.05) { d.y = U.rand(-0.15, 0.1); d.x = U.rand(0, 1); }
        const X = d.x * vw, Y = d.y * vh;
        ctx.moveTo(X, Y);
        ctx.lineTo(X + (d.x - 0.5) * vw * 0.03 * (0.3 + sp), Y + d.l * vh * (1 + sp * 0.4));
      }
      ctx.stroke();
      if (th.time === 'night' || th.time === 'overcast') {
        v.nextBolt -= dt;
        if (v.nextBolt <= 0) { v.flash = 1; v.nextBolt = U.rand(8, 16); if (TG.Audio) setTimeout(() => TG.Audio.play('thunder'), U.rand(400, 1400)); }
      }
    } else if (th.weather === 'snow') {
      if (!v.snow) { v.snow = []; for (let i = 0; i < 140; i++) v.snow.push({ x: Math.random(), y: Math.random(), r: U.rand(1, 3.2), ph: Math.random() * 6, s: U.rand(0.05, 0.14) }); }
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      const hz = horizon / vh;
      for (const f of v.snow) {
        const dxc = f.x - 0.5, dyc = f.y - hz;
        f.x += (dxc * sp * 1.4 + Math.sin(R.t * 1.5 + f.ph) * 0.02) * dt;
        f.y += (f.s + Math.max(0, dyc) * sp * 1.2) * dt;
        if (f.y > 1.02 || f.x < -0.02 || f.x > 1.02) { f.x = U.rand(0.1, 0.9); f.y = U.rand(0, hz + 0.1); }
        const r = f.r * R.dpr * (0.6 + Math.max(0, f.y - hz) * 1.5);
        ctx.moveTo(f.x * vw + r, f.y * vh);
        ctx.arc(f.x * vw, f.y * vh, r, 0, Math.PI * 2);
      }
      ctx.fill();
    }
    if (th.weather === 'fog') {
      ctx.fillStyle = U.lin(ctx, 0, horizon - vh * 0.1, 0, vh, [0, U.rgba(th.fog, 0.55), 0.5, U.rgba(th.fog, 0.18), 1, U.rgba(th.fog, 0.05)]);
      ctx.fillRect(0, horizon - vh * 0.1, vw, vh);
    }
  };

  /* ---------- Postproceso ---------- */
  R.vignette = function (vw, vh) {
    const key = vw + 'x' + vh;
    if (R.vig[key]) return R.vig[key];
    const cv = U.canvas(vw, vh);
    const c = cv.getContext('2d');
    const r = Math.hypot(vw, vh) / 2;
    c.fillStyle = U.rad(c, vw / 2, vh * 0.55, r * 0.45, r, [0, 'rgba(0,0,0,0)', 1, 'rgba(0,0,0,0.5)']);

    R.vig[key] = cv;
    return cv;
  };
  R.post = function (ctx, race, v, vw, vh, horizon, dt) {
    const th = race.theme, p = v.player;
    const sp = p.speed / p.st.vmax;
    // líneas de velocidad
    const nit = p.nitroT > 0;
    if (!race.demo && (nit || sp > 0.9)) {
      const k = nit ? 1 : U.clamp((sp - 0.9) / 0.1, 0, 1) * 0.55;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = nit ? 'rgba(160,210,255,' + (0.22 * k).toFixed(3) + ')' : 'rgba(255,255,255,' + (0.14 * k).toFixed(3) + ')';
      ctx.lineWidth = 2 * R.dpr;
      ctx.beginPath();
      const cx = vw / 2, cy = horizon;
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2 + i * 1.7;
        const ph = (R.t * 2.4 + i * 0.37) % 1;
        const r0 = (0.3 + ph * 0.9) * vh, r1 = r0 + vh * 0.16 * (0.4 + k);
        const ca = Math.cos(a), sa = Math.sin(a) * 0.62;
        ctx.moveTo(cx + ca * r0, cy + sa * r0);
        ctx.lineTo(cx + ca * r1, cy + sa * r1);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }
    // destello de lente
    if (v.sunX != null && th.sun && !th.weather.match(/rain|fog/)) {
      ctx.globalCompositeOperation = 'lighter';
      const dx = vw / 2 - v.sunX, dy = vh / 2 - v.sunY;
      [[0.35, 0.05, 0.1], [0.62, 0.03, 0.07], [0.9, 0.09, 0.05], [1.25, 0.05, 0.08]].forEach((f) => {
        const fxp = v.sunX + dx * f[0], fyp = v.sunY + dy * f[0], rr = vh * f[1];
        ctx.fillStyle = U.rad(ctx, fxp, fyp, 0, rr, [0, U.rgba(th.sun.glow, f[2]), 1, U.rgba(th.sun.glow, 0)]);
        ctx.fillRect(fxp - rr, fyp - rr, rr * 2, rr * 2);
      });
      ctx.globalCompositeOperation = 'source-over';
    }
    if (th.grade) {
      ctx.globalAlpha = th.grade.a;
      ctx.globalCompositeOperation = th.grade.op;
      ctx.fillStyle = th.grade.c;
      ctx.fillRect(0, 0, vw, vh);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(R.vignette(vw, vh), 0, 0);
    if (nit) {
      ctx.fillStyle = U.rad(ctx, vw / 2, vh / 2, vh * 0.3, Math.hypot(vw, vh) * 0.6, [0, 'rgba(40,120,255,0)', 1, 'rgba(40,120,255,0.28)']);
      ctx.fillRect(0, 0, vw, vh);
    }
    if (v.hitFlash > 0) {
      ctx.fillStyle = 'rgba(255,40,40,' + (v.hitFlash * 0.22).toFixed(3) + ')';
      ctx.fillRect(0, 0, vw, vh);
    }
    if (v.flash > 0) {
      ctx.fillStyle = 'rgba(235,240,255,' + (v.flash * 0.55).toFixed(3) + ')';
      ctx.fillRect(0, 0, vw, vh);
      v.flash = Math.max(0, v.flash - dt * 3.5);
    }
  };
})(window.TG);
