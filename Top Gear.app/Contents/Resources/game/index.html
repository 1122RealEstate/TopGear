<script>
'use strict';
/* ============================================================
   HUD de carrera
   ============================================================ */
(function (TG) {
  const U = TG.U, C = TG.C;
  const HUD = (TG.HUD = {});
  const F_DATA = '"DIN Alternate", "DIN Condensed", Bahnschrift, "Roboto Condensed", "Arial Narrow", sans-serif';
  const F_DISP = '"Avenir Next Condensed", "Futura", Bahnschrift, "Arial Narrow", sans-serif';
  const F_BODY = '"Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif';
  const ORANGE = '#ff7a1a', GULF = '#7fcbe8', CHALK = '#f3f5f8', SIGNAL = '#ff3b3b';

  const font = (w, px, fam, it) => (it ? 'italic ' : '') + w + ' ' + Math.round(px) + 'px ' + fam;

  function panel(ctx, x, y, w, h, s, accent) {
    ctx.fillStyle = 'rgba(12,14,20,0.62)';
    U.rr(ctx, x, y, w, h, 10 * s);
    ctx.fill();
    ctx.fillStyle = accent || ORANGE;
    ctx.fillRect(x + 10 * s, y, w - 20 * s, 3 * s);
    ctx.fillStyle = GULF;
    ctx.fillRect(x + 10 * s, y + 3 * s, (w - 20 * s) * 0.18, 2 * s);
  }
  function txt(ctx, t, x, y, f, col, align, base) {
    ctx.font = f;
    ctx.fillStyle = col;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = base || 'alphabetic';
    ctx.fillText(t, x, y);
  }

  HUD.msg = function (v, text, o) {
    o = o || {};
    v.msgs = v.msgs.filter((m) => m.slot !== (o.slot || 'main'));
    v.msgs.push({ text, sub: o.sub || '', t: 0, dur: o.dur || 1.6, col: o.col || CHALK, slot: o.slot || 'main', big: o.big || 1 });
  };
  HUD.float = function (v, text, col) {
    v.floats = v.floats || [];
    v.floats.push({ text, col: col || '#ffd21f', t: 0 });
  };

  HUD.mapImage = function (race, size) {
    const key = size;
    if (race._map && race._map.key === key) return race._map.img;
    const cv = U.canvas(size, size);
    const c = cv.getContext('2d');
    const pts = race.track.map.pts, N = race.track.N;
    const pad = size * 0.1, S = size - pad * 2;
    c.lineJoin = 'round'; c.lineCap = 'round';
    const path = () => {
      c.beginPath();
      for (let i = 0; i < N; i += 2) {
        const x = pad + (pts[i * 2] + 0.5) * S, y = pad + (pts[i * 2 + 1] + 0.5) * S;
        if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.closePath();
    };
    path(); c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = size * 0.06; c.stroke();
    path(); c.strokeStyle = 'rgba(243,245,248,0.85)'; c.lineWidth = size * 0.022; c.stroke();
    const sx = pad + (pts[0] + 0.5) * S, sy = pad + (pts[1] + 0.5) * S;
    c.fillStyle = ORANGE; c.fillRect(sx - size * 0.03, sy - size * 0.012, size * 0.06, size * 0.024);
    race._map = { key, img: cv, pad, S };
    return cv;
  };

  function tach(ctx, cx, cy, r, car, race, s) {
    const eng = car.model.eng;
    const red = eng.red;
    const maxR = Math.ceil((red * 1.1) / 1000) * 1000;
    const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
    const ang = (rpm) => a0 + (a1 - a0) * U.clamp(rpm / maxR, 0, 1);
    ctx.fillStyle = U.rad(ctx, cx, cy, r * 0.2, r * 1.12, [0, 'rgba(18,20,28,0.8)', 1, 'rgba(8,9,13,0.72)']);
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.arc(cx, cy, r * 1.1, 0, Math.PI * 2); ctx.stroke();
    // zona de salida perfecta
    if (race.phase === 'count' || race.phase === 'intro') {
      ctx.strokeStyle = 'rgba(70,217,138,0.85)'; ctx.lineWidth = r * 0.12;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.86, ang(red * 0.55), ang(red * 0.84)); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,59,59,0.9)'; ctx.lineWidth = r * 0.07;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.93, ang(red * 0.94), a1); ctx.stroke();
    // arco de progreso
    const rp = car.rpm;
    const grad = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
    grad.addColorStop(0, GULF); grad.addColorStop(0.65, ORANGE); grad.addColorStop(1, SIGNAL);
    ctx.strokeStyle = grad; ctx.lineWidth = r * 0.06;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, a0, ang(rp)); ctx.stroke();
    // marcas
    ctx.strokeStyle = 'rgba(243,245,248,0.8)';
    for (let v = 0; v <= maxR; v += 500) {
      const a = ang(v), major = v % 1000 === 0;
      const r0 = r * (major ? 0.7 : 0.75), r1 = r * 0.84;
      ctx.lineWidth = (major ? 3 : 1.5) * s;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
      if (major) txt(ctx, String(v / 1000), cx + Math.cos(a) * r * 0.56, cy + Math.sin(a) * r * 0.56, font(700, r * 0.15, F_DATA), v >= red * 0.94 ? SIGNAL : 'rgba(243,245,248,0.85)', 'center', 'middle');
    }
    // aguja
    const a = ang(rp);
    ctx.strokeStyle = '#ff5a2a'; ctx.lineWidth = 4 * s;
    ctx.shadowColor = '#ff5a2a'; ctx.shadowBlur = 10 * s;
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * r * 0.12, cy - Math.sin(a) * r * 0.12); ctx.lineTo(cx + Math.cos(a) * r * 0.86, cy + Math.sin(a) * r * 0.86); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#20232c'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.1, 0, Math.PI * 2); ctx.fill();
    // velocidad
    const units = TG.Save.data.settings.units;
    const kmh = car.speed / C.KMH;
    const val = Math.round(units === 'mph' ? kmh * 0.6214 : kmh);
    txt(ctx, String(val), cx, cy + r * 0.44, font(700, r * 0.46, F_DATA), CHALK, 'center', 'middle');
    txt(ctx, units === 'mph' ? 'MPH' : 'KM/H', cx, cy + r * 0.74, font(700, r * 0.13, F_DATA), 'rgba(243,245,248,0.6)', 'center', 'middle');
    // marcha
    const gx = cx + r * 0.62, gy = cy + r * 0.62;
    const shiftNow = car.manual && car.rpm > red * 0.93;
    ctx.fillStyle = shiftNow ? (Math.floor(R_t() * 10) % 2 ? SIGNAL : ORANGE) : 'rgba(255,122,26,0.18)';
    U.rr(ctx, gx - r * 0.2, gy - r * 0.2, r * 0.4, r * 0.4, 6 * s); ctx.fill();
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 2 * s; ctx.stroke();
    const gtxt = race.phase === 'race' || race.phase === 'done' ? String(car.gear) : 'N';
    txt(ctx, gtxt, gx, gy + r * 0.02, font(700, r * 0.3, F_DATA), shiftNow ? '#111' : CHALK, 'center', 'middle');
    if (car.manual) txt(ctx, 'MAN', gx, gy + r * 0.3, font(700, r * 0.1, F_DATA), GULF, 'center', 'middle');
  }
  const R_t = () => (TG.Render ? TG.Render.t : 0);

  HUD.draw = function (ctx, race, v, vw, vh, dt) {
    const p = v.player;
    const split = race.views.length > 1;
    const s = Math.min(vh / 720, vw / 1280) * (split ? 1.3 : 1);
    const m = 22 * s;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const showRace = race.phase !== 'intro';

    if (showRace) {
      // --- posición y vuelta
      const pw = 190 * s, ph = 108 * s;
      panel(ctx, m, m, pw, ph, s);
      txt(ctx, 'POSICIÓN', m + 16 * s, m + 26 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)');
      txt(ctx, String(p.pos), m + 14 * s, m + 88 * s, font(700, 62 * s, F_DATA), CHALK);
      ctx.font = font(700, 62 * s, F_DATA);
      const wpos = ctx.measureText(String(p.pos)).width;
      txt(ctx, '/' + race.cars.length, m + 18 * s + wpos, m + 88 * s, font(700, 24 * s, F_DATA), 'rgba(243,245,248,0.55)');
      const lapN = U.clamp(p.lapsDone + 1, 1, race.laps);
      txt(ctx, 'VUELTA', m + pw - 14 * s, m + 26 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)', 'right');
      txt(ctx, lapN + '/' + race.laps, m + pw - 14 * s, m + 58 * s, font(700, 30 * s, F_DATA), p.finished ? ORANGE : CHALK, 'right');
      if (p.draft > 0.5 && !p.finished) {
        txt(ctx, 'REBUFO', m + pw - 14 * s, m + 88 * s, font(700, 15 * s, F_DATA), GULF, 'right');
      }
      // --- flechas de cambio de posición
      (v.msgs || []).forEach((mm) => {
        if (mm.slot !== 'pos') return;
        const k = 1 - mm.t / mm.dur;
        ctx.globalAlpha = Math.min(1, k * 3);
        txt(ctx, mm.text, m + pw + 12 * s, m + 70 * s - (1 - k) * 12 * s, font(700, 26 * s, F_DATA), mm.col);
        ctx.globalAlpha = 1;
      });

      // --- tiempos
      const tw = 230 * s, th = split ? 96 * s : 120 * s;
      const tx = vw - m - tw;
      panel(ctx, tx, m, tw, th, s, GULF);
      txt(ctx, 'TIEMPO', tx + 16 * s, m + 26 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)');
      txt(ctx, U.timeShort(p.finished ? p.finishTime : race.time), tx + tw - 16 * s, m + 30 * s, font(700, 26 * s, F_DATA), CHALK, 'right');
      const cur = p.finished ? p.lastLap : race.phase === 'race' || race.phase === 'done' ? race.time - p.lapStart : 0;
      txt(ctx, 'VUELTA', tx + 16 * s, m + 58 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)');
      txt(ctx, U.timeShort(p.lapsDone < 0 && race.phase !== 'race' ? 0 : cur), tx + tw - 16 * s, m + 60 * s, font(700, 20 * s, F_DATA), CHALK, 'right');
      txt(ctx, 'MEJOR', tx + 16 * s, m + 86 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)');
      txt(ctx, U.timeShort(p.bestLap), tx + tw - 16 * s, m + 88 * s, font(700, 20 * s, F_DATA), GULF, 'right');
      if (race.mode === 'time' && race.ghostData) {
        const gy = m + th + 34 * s;
        ctx.fillStyle = 'rgba(12,14,20,0.62)';
        U.rr(ctx, vw - m - 210 * s, gy - 26 * s, 210 * s, 36 * s, 8 * s); ctx.fill();
        txt(ctx, 'FANTASMA', vw - m - 196 * s, gy - 2 * s, font(700, 13 * s, F_DATA), race.ghostCar && race.ghostCar.visible ? GULF : 'rgba(243,245,248,0.5)');
        txt(ctx, U.timeShort(race.ghostData.time), vw - m - 14 * s, gy, font(700, 20 * s, F_DATA), CHALK, 'right');
      }
      if (race.track.coins) {
        const my = m + th + 34 * s;
        ctx.fillStyle = 'rgba(12,14,20,0.62)';
        U.rr(ctx, vw - m - 150 * s, my - 26 * s, 150 * s, 36 * s, 8 * s); ctx.fill();
        ctx.fillStyle = '#ffcc1a'; ctx.beginPath(); ctx.arc(vw - m - 128 * s, my - 8 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
        txt(ctx, '$', vw - m - 128 * s, my - 7 * s, font(900, 13 * s, F_DISP), '#8a5a00', 'center', 'middle');
        txt(ctx, U.money(p.coinMoney).replace('$', ''), vw - m - 14 * s, my, font(700, 22 * s, F_DATA), '#ffd21f', 'right');
      }

      // --- tacómetro
      const r = (split ? 78 : 104) * s;
      const cx = vw - m - r * 1.1, cy = vh - m - r * 1.05;
      tach(ctx, cx, cy, r, p, race, s);

      // --- nitro y combustible
      const bx = cx - r * 1.1 - 22 * s - 170 * s, by = vh - m - (split ? 74 : 92) * s;
      const bw = 170 * s;
      panel(ctx, bx, by, bw, (split ? 74 : 92) * s, s, GULF);
      txt(ctx, 'NITRO', bx + 14 * s, by + 24 * s, font(700, 13 * s, F_DATA), 'rgba(243,245,248,0.6)');
      const maxN = Math.max(p.st.nitroN, p.nitroN);
      const pillW = Math.min(18 * s, (bw - 90 * s) / Math.max(1, maxN));
      for (let i = 0; i < maxN; i++) {
        const px = bx + 70 * s + i * (pillW + 4 * s);
        ctx.fillStyle = i < p.nitroN ? '#3aa0ff' : 'rgba(255,255,255,0.12)';
        U.rr(ctx, px, by + 12 * s, pillW, 14 * s, 4 * s); ctx.fill();
      }
      if (p.nitroT > 0) {
        ctx.fillStyle = 'rgba(58,160,255,0.3)'; ctx.fillRect(bx + 14 * s, by + 32 * s, bw - 28 * s, 5 * s);
        ctx.fillStyle = '#7fd0ff'; ctx.fillRect(bx + 14 * s, by + 32 * s, (bw - 28 * s) * U.clamp(p.nitroT / p.st.nitroDur, 0, 1), 5 * s);
      }
      if (!race.demo) {
        const fy = by + (split ? 52 : 64) * s;
        txt(ctx, 'GASOLINA', bx + 14 * s, fy, font(700, 13 * s, F_DATA), p.fuel < 20 && Math.floor(R_t() * 3) % 2 ? SIGNAL : 'rgba(243,245,248,0.6)');
        const gx0 = bx + 86 * s, gw = bw - 100 * s;
        ctx.fillStyle = 'rgba(255,255,255,0.12)'; U.rr(ctx, gx0, fy - 11 * s, gw, 12 * s, 4 * s); ctx.fill();
        const fcol = p.fuel < 20 ? SIGNAL : p.fuel < 45 ? '#ffd21f' : '#46d98a';
        ctx.fillStyle = fcol; U.rr(ctx, gx0, fy - 11 * s, Math.max(4 * s, gw * (p.fuel / 100)), 12 * s, 4 * s); ctx.fill();
      }

      // --- minimapa
      const ms = (split ? 120 : 170) * s;
      const mx = m, my2 = vh - m - ms;
      ctx.fillStyle = 'rgba(12,14,20,0.5)';
      U.rr(ctx, mx, my2, ms, ms, 12 * s); ctx.fill();
      const mapSize = Math.round(ms);
      const img = HUD.mapImage(race, mapSize);
      ctx.drawImage(img, mx, my2, ms, ms);
      const mp = race._map;
      const pts = race.track.map.pts;
      const sc = ms / mapSize;
      const dot = (car, rad, col) => {
        const i = Math.floor(car.z / C.SEG) % race.track.N;
        const x = mx + (mp.pad + (pts[i * 2] + 0.5) * mp.S) * sc, y = my2 + (mp.pad + (pts[i * 2 + 1] + 0.5) * mp.S) * sc;
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
      };
      race.cars.forEach((c) => { if (!c.isPlayer) dot(c, 3 * s, c.pos === 1 ? '#ffd21f' : 'rgba(243,245,248,0.75)'); });
      race.players.forEach((c) => {
        const col = c.pIndex === 0 ? ORANGE : GULF;
        if (c === p) { ctx.globalAlpha = 0.35 + 0.25 * Math.sin(R_t() * 6); dot(c, 9 * s, col); ctx.globalAlpha = 1; }
        dot(c, 5 * s, col);
      });
    }

    // --- semáforo / cuenta atrás
    if (race.phase === 'count') {
      const n = 3 - Math.floor(race.phaseT);
      const lx = vw / 2, ly = vh * 0.2;
      const lw = 300 * s, lh = 70 * s;
      ctx.fillStyle = 'rgba(10,11,15,0.8)';
      U.rr(ctx, lx - lw / 2, ly - lh / 2, lw, lh, 16 * s); ctx.fill();
      for (let i = 0; i < 5; i++) {
        const on = i < Math.round(((race.phaseT) / 3) * 5 + 0.49);
        const x = lx - lw / 2 + 36 * s + i * 57 * s;
        ctx.fillStyle = on ? SIGNAL : '#3a1014';
        if (on) { ctx.shadowColor = SIGNAL; ctx.shadowBlur = 18 * s; }
        ctx.beginPath(); ctx.arc(x, ly, 20 * s, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
      const k = race.phaseT % 1;
      ctx.globalAlpha = 1 - k * 0.6;
      txt(ctx, String(Math.max(1, n)), vw / 2, vh * 0.44, font(800, (130 + k * 40) * s, F_DISP, true), CHALK, 'center', 'middle');
      ctx.globalAlpha = 1;
      if (!p.autopilot) txt(ctx, 'Mantén las revoluciones en la zona verde', vw / 2, vh * 0.56, font(600, 17 * s, F_BODY), 'rgba(243,245,248,0.8)', 'center', 'middle');
    }
    if (race.phase === 'race' && race.phaseT < 1) {
      const k = race.phaseT;
      ctx.globalAlpha = 1 - k;
      txt(ctx, '¡YA!', vw / 2, vh * 0.44, font(800, (150 + k * 80) * s, F_DISP, true), '#46d98a', 'center', 'middle');
      ctx.globalAlpha = 1;
    }
    // --- presentación del circuito
    if (race.phase === 'intro') {
      const k = U.clamp(race.phaseT / 0.5, 0, 1) * U.clamp((2.6 - race.phaseT) / 0.4, 0, 1);
      ctx.globalAlpha = k;
      const y = vh * 0.72;
      ctx.fillStyle = 'rgba(10,11,15,0.72)';
      ctx.fillRect(0, y - 70 * s, vw, 140 * s);
      ctx.fillStyle = ORANGE; ctx.fillRect(0, y - 70 * s, vw, 4 * s);
      ctx.fillStyle = GULF; ctx.fillRect(0, y - 64 * s, vw * 0.3, 2 * s);
      txt(ctx, race.cup.name.toUpperCase() + '  ·  ' + (race.mode === 'career' ? 'CARRERA ' + (race.def.index + 1) + ' DE 4' : race.mode === 'time' ? 'CONTRARRELOJ' : race.mode === 'versus' ? '2 JUGADORES' : 'CARRERA RÁPIDA'), vw / 2, y - 30 * s, font(700, 17 * s, F_DATA), GULF, 'center', 'middle');
      txt(ctx, race.def.name.toUpperCase(), vw / 2, y + 12 * s, font(800, 54 * s, F_DISP, true), CHALK, 'center', 'middle');
      txt(ctx, race.laps + ' VUELTAS  ·  ' + TG.TIME_LABEL[race.theme.time].toUpperCase() + '  ·  ' + TG.WEATHER_LABEL[race.theme.weather].toUpperCase(), vw / 2, y + 50 * s, font(700, 16 * s, F_DATA), 'rgba(243,245,248,0.75)', 'center', 'middle');
      ctx.globalAlpha = 1;
    }

    // --- mensajes centrales
    v.msgs = (v.msgs || []).filter((mm) => (mm.t += dt) < mm.dur);
    v.msgs.forEach((mm) => {
      if (mm.slot === 'pos') return;
      const k = mm.t / mm.dur;
      const inK = U.clamp(mm.t / 0.18, 0, 1), outK = U.clamp((mm.dur - mm.t) / 0.3, 0, 1);
      ctx.globalAlpha = Math.min(inK, outK);
      const sc = (0.8 + 0.2 * U.easeOutCubic(inK)) * mm.big;
      const y = mm.slot === 'low' ? vh * 0.36 : vh * 0.27;
      ctx.save();
      ctx.translate(vw / 2, y);
      ctx.scale(sc, sc);
      ctx.lineWidth = 6 * s; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineJoin = 'round';
      ctx.font = font(800, (mm.slot === 'low' ? 30 : 46) * s, F_DISP, true);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeText(mm.text, 0, 0);
      ctx.fillStyle = mm.col; ctx.fillText(mm.text, 0, 0);
      if (mm.sub) {
        ctx.font = font(700, 18 * s, F_DATA);
        ctx.strokeText(mm.sub, 0, 36 * s);
        ctx.fillStyle = CHALK; ctx.fillText(mm.sub, 0, 36 * s);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
      void k;
    });
    // --- textos flotantes (monedas)
    if (v.floats && v.carScreen) {
      v.floats = v.floats.filter((f) => (f.t += dt) < 1);
      v.floats.forEach((f) => {
        ctx.globalAlpha = 1 - f.t;
        txt(ctx, f.text, v.carScreen.x, v.carScreen.y - v.carScreen.h * 0.9 - f.t * 60 * s, font(700, 24 * s, F_DATA), f.col, 'center', 'middle');
      });
      ctx.globalAlpha = 1;
    }
    // --- meta
    if (p.finished) {
      const k = U.clamp((race.time - p.finishTime) / 0.4, 0, 1);
      ctx.globalAlpha = k;
      txt(ctx, p.finishPos === 1 && race.mode !== 'time' ? '¡VICTORIA!' : '¡META!', vw / 2, vh * 0.3, font(800, 64 * s, F_DISP, true), p.finishPos === 1 ? '#ffd21f' : CHALK, 'center', 'middle');
      if (race.mode !== 'time') txt(ctx, 'Terminas ' + p.pos + 'º', vw / 2, vh * 0.3 + 52 * s, font(700, 26 * s, F_DATA), CHALK, 'center', 'middle');
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };
})(window.TG);

</script>
<script>
'use strict';
/* ============================================================
   Interfaz: pantallas de menú con navegación por teclado
   ============================================================ */
(function (TG) {
  const U = TG.U;
  const UI = (TG.UI = { cur: null, capture: null });
  const S = () => TG.Save.data;
  const $ = (sel, el) => (el || document).querySelector(sel);
  const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
  const root = () => document.getElementById('ui');
  const SCREENS = {};
  UI.SCREENS = SCREENS;

  /* ---------- Núcleo ---------- */
  UI.init = function () {
    TG.Input.on((e, code) => UI.onKey(e, code));
  };

  UI.show = function (name, params) {
    const def = SCREENS[name];
    if (!def) return;
    if (UI.cur && UI.cur.leave) { try { UI.cur.leave(); } catch (e) { /* ok */ } }
    UI.capture = null;
    const r = root();
    r.innerHTML = '';
    const el = document.createElement('section');
    el.className = 'screen scr-' + name + (def.studio ? ' studio' : '') + (def.overlay ? ' overlay' : '');
    r.appendChild(el);
    const ctx = { name, params: params || {}, el, def, focused: null, modal: null };
    UI.cur = ctx;
    document.body.classList.toggle('menu', def.dim !== false);
    document.body.classList.toggle('studio-on', !!def.studio);
    def.render(ctx);
    UI.wire(el);
    const first = ctx.initial ? $(ctx.initial, el) : null;
    UI.focus(first || UI.focusables(ctx)[0]);
    if (TG.Game && TG.Game.onScreen) TG.Game.onScreen(name, def);
  };
  UI.refresh = function (keepSel) {
    const ctx = UI.cur;
    if (!ctx) return;
    const idx = ctx.focused ? ctx.focused.dataset.key : null;
    const scroll = {};
    $$('[data-scroll]', ctx.el).forEach((s) => { scroll[s.dataset.scroll] = s.scrollTop; });
    ctx.el.innerHTML = '';
    ctx.modal = null;
    ctx.def.render(ctx);
    UI.wire(ctx.el);
    $$('[data-scroll]', ctx.el).forEach((s) => { if (scroll[s.dataset.scroll] != null) s.scrollTop = scroll[s.dataset.scroll]; });
    const sel = keepSel || (idx != null ? '[data-key="' + idx + '"]' : null);
    const el = sel ? $(sel, ctx.el) : null;
    UI.focus(el || UI.focusables(ctx)[0], true);
  };
  UI.hide = function () {
    if (UI.cur && UI.cur.leave) { try { UI.cur.leave(); } catch (e) { /* ok */ } }
    root().innerHTML = '';
    UI.cur = null;
    UI.capture = null;
    document.body.classList.remove('menu', 'studio-on');
  };
  UI.wire = function (el) {
    $$('[data-nav]', el).forEach((n) => {
      if (n._wired) return;
      n._wired = true;
      n.addEventListener('mouseenter', () => { if (UI.cur && (!UI.cur.modal || UI.cur.modal.contains(n))) UI.focus(n); });
    });
    $$('[data-arrow]', el).forEach((a) => {
      if (a._wired) return;
      a._wired = true;
      a.addEventListener('click', (e) => {
        e.stopPropagation();
        const row = a.closest('[data-nav]');
        if (row && row._adjust) { row._adjust(+a.dataset.arrow); TG.Audio.play('nav'); }
      });
    });
  };
  UI.focusables = function (ctx) {
    const scope = ctx.modal || ctx.el;
    return $$('[data-nav]', scope).filter((n) => n.offsetParent !== null && !n.hasAttribute('data-off'));
  };
  UI.focus = function (el, silent) {
    const ctx = UI.cur;
    if (!ctx || !el) return;
    if (ctx.focused && ctx.focused !== el) ctx.focused.classList.remove('focus');
    ctx.focused = el;
    el.classList.add('focus');
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (ctx.onFocus) ctx.onFocus(el, silent);
  };
  UI.move = function (dir) {
    const ctx = UI.cur;
    const list = UI.focusables(ctx);
    const cur = ctx.focused;
    if (!cur || list.indexOf(cur) < 0) { UI.focus(list[0]); return; }
    const r0 = cur.getBoundingClientRect();
    const c0x = r0.left + r0.width / 2, c0y = r0.top + r0.height / 2;
    let best = null, bs = Infinity;
    for (const el of list) {
      if (el === cur) continue;
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = cx - c0x, dy = cy - c0y;
      let main, cross;
      if (dir === 'up') { if (dy >= -4) continue; main = -dy; cross = Math.abs(dx); }
      else if (dir === 'down') { if (dy <= 4) continue; main = dy; cross = Math.abs(dx); }
      else if (dir === 'left') { if (dx >= -4) continue; main = -dx; cross = Math.abs(dy); }
      else { if (dx <= 4) continue; main = dx; cross = Math.abs(dy); }
      const sc = main + cross * 2.4;
      if (sc < bs) { bs = sc; best = el; }
    }
    if (!best && (dir === 'up' || dir === 'down') && ctx.wrap !== false) {
      const col = list.filter((el) => Math.abs(el.getBoundingClientRect().left - r0.left) < 40);
      if (col.length > 1) best = dir === 'down' ? col[0] : col[col.length - 1];
      if (best === cur) best = null;
    }
    if (best) { UI.focus(best); TG.Audio.play('nav'); }
  };
  UI.step = function (d) {
    const ctx = UI.cur;
    const list = UI.focusables(ctx);
    if (!list.length) return;
    let i = list.indexOf(ctx.focused);
    i = i < 0 ? 0 : (i + d + list.length) % list.length;
    UI.focus(list[i]);
    TG.Audio.play('nav');
  };
  UI.onKey = function (e, code) {
    if (!UI.cur) return false;
    TG.Audio.init();
    if (UI.capture) return UI.capture(code, e);
    const ctx = UI.cur;
    if (ctx.onKey && ctx.onKey(code, e) === true) return true;
    const f = ctx.focused;
    switch (code) {
      case 'ArrowUp': case 'KeyW': if (ctx.linear && !ctx.modal) UI.step(-1); else UI.move('up'); return true;
      case 'ArrowDown': case 'KeyS': if (ctx.linear && !ctx.modal) UI.step(1); else UI.move('down'); return true;
      case 'ArrowLeft': case 'KeyA':
        if (f && f._adjust) { f._adjust(-1); TG.Audio.play('nav'); return true; }
        UI.move('left'); return true;
      case 'ArrowRight': case 'KeyD':
        if (f && f._adjust) { f._adjust(1); TG.Audio.play('nav'); return true; }
        UI.move('right'); return true;
      case 'Enter': case 'NumpadEnter': case 'Space':
        if (f) { if (!f._silent) TG.Audio.play('select'); f.click(); }
        return true;
      case 'Escape': case 'Backspace':
        UI.back(); return true;
      default: return false;
    }
  };
  UI.back = function () {
    const ctx = UI.cur;
    if (!ctx) return;
    if (ctx.modal) { UI.closeModal(); TG.Audio.play('back'); return; }
    if (ctx.onBack) { TG.Audio.play('back'); ctx.onBack(); }
  };
  UI.modal = function (html, buttons, opt) {
    const ctx = UI.cur;
    opt = opt || {};
    const wrap = U.el('div', 'modal-wrap');
    wrap.innerHTML = '<div class="modal">' + html + '<div class="modal-btns">' + buttons.map((b, i) => '<button class="btn ' + (b.cls || '') + '" data-nav data-mb="' + i + '">' + b.label + '</button>').join('') + '</div></div>';
    ctx.el.appendChild(wrap);
    ctx.prevFocus = ctx.focused;
    ctx.modal = wrap;
    buttons.forEach((b, i) => { $('[data-mb="' + i + '"]', wrap).addEventListener('click', () => { UI.closeModal(); if (b.fn) b.fn(); }); });
    UI.wire(wrap);
    UI.focus($('[data-mb="' + (opt.focus || 0) + '"]', wrap), true);
  };
  UI.closeModal = function () {
    const ctx = UI.cur;
    if (!ctx || !ctx.modal) return;
    ctx.modal.remove();
    ctx.modal = null;
    if (ctx.prevFocus && ctx.el.contains(ctx.prevFocus)) UI.focus(ctx.prevFocus, true);
    else UI.focus(UI.focusables(ctx)[0], true);
  };
  UI.toast = function (text, kind) {
    const t = document.getElementById('toast');
    const n = U.el('div', 'toast ' + (kind || ''), text);
    t.appendChild(n);
    setTimeout(() => n.classList.add('out'), 2200);
    setTimeout(() => n.remove(), 2700);

  const esc = U.esc;

  function header(title, eyebrow) {

  }
  function hints(list) {
    return '<footer class="hints">' + list.map((h) => '<span><kbd>' + h[0] + '</kbd>' + esc(h[1]) + '</span>').join('') + '</footer>';
  }
  const HINTS = [['↑↓←→', 'Navegar'], ['Intro', 'Elegir'], ['Esc', 'Volver']];
  function speedTxt(kmh) {
    return S().settings.units === 'mph' ? Math.round(kmh * 0.6214) + ' mph' : Math.round(kmh) + ' km/h';
  }
  function bars(v, v2) {
    let h = '';
    for (let i = 0; i < 20; i++) {
      const t = (i + 0.5) / 20;
      h += '<i class="' + (t <= v ? 'on' : v2 && t <= v2 ? 'nx' : '') + '"></i>';
    }
    return h;
  }
  function statBlock(st, st2) {
    const b = TG.statBars(st), b2 = st2 ? TG.statBars(st2) : null;
    const row = (label, key, val, val2) => '<div class="stat"><span class="stat-l">' + label + '</span><span class="stat-bar">' + bars(b[key], b2 && b2[key] > b[key] + 0.001 ? b2[key] : 0) + '</span><span class="stat-v">' + val + (val2 && val2 !== val ? ' <em>→ ' + val2 + '</em>' : '') + '</span></div>';
    const grip = (s) => Math.round(U.clamp((s.grip - 0.9) / 0.65, 0, 1) * 100) + '';
    return '<div class="stats">' +
      row('Velocidad', 'speed', speedTxt(st.top), st2 ? speedTxt(st2.top) : null) +
      row('Aceleración', 'accel', '0-100 ' + st.t0100.toFixed(1) + ' s', st2 ? '0-100 ' + st2.t0100.toFixed(1) + ' s' : null) +
      row('Manejo', 'grip', grip(st) + '/100', st2 ? grip(st2) + '/100' : null) +
      row('Nitro', 'nitro', st.nitroN + ' cargas', st2 ? st2.nitroN + ' cargas' : null) + '</div>';
  }
  function adjRow(key, label, valueHtml, fn, extraCls) {
    return { html: '<div class="row ' + (extraCls || '') + '" data-nav data-key="' + key + '" data-adj="1"><span class="row-label">' + label + '</span><span class="row-val"><i class="arr" data-arrow="-1">◀</i><b class="row-b">' + valueHtml + '</b><i class="arr" data-arrow="1">▶</i></span></div>', key, fn };
  }
  function bindAdj(el, rows) {
    rows.forEach((r) => {
      const n = $('[data-key="' + r.key + '"]', el);
      if (n) n._adjust = r.fn;
    });
  }
  function showroomInto(canvas, model, color) {
    requestAnimationFrame(() => {
      const r = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.max(200, Math.round(r.width * dpr));
      canvas.height = Math.max(100, Math.round(r.height * dpr));
      TG.Art.showroom(canvas, model, color);
    });
  }
  function flagCanvas(id, w, h) {
    const c = U.canvas(w * 2, h * 2);
    TG.Art.flag(c.getContext('2d'), id, 0, 0, w * 2, h * 2);
    c.className = 'flag';
    c.style.width = w + 'px'; c.style.height = h + 'px';
    return c;
  }
  function thumbInto(canvas, themeId) {
    const img = TG.Art.themePreview(TG.THEMES[themeId], canvas.width, canvas.height);
    canvas.getContext('2d').drawImage(img, 0, 0);
  }

      const cfg = ctx.params.cfg;
      const t = TG.TRACKS[cfg.trackId], th = TG.THEMES[t.theme], cup = TG.CUPS[t.cup];
      ctx.el.innerHTML = '<div class="loading"><canvas class="ld-bg" width="960" height="510"></canvas><div class="ld-info"><span class="flag-slot"></span>' +
        '<div class="eyebrow">' + esc(cup.name) + '</div><h1>' + esc(t.name) + '</h1><div class="ld-meta">' + TG.TIME_LABEL[th.time] + ' · ' + TG.WEATHER_LABEL[th.weather] + ' · ' + (cfg.laps || 3) + ' vueltas</div>' +
        '<div class="ld-bar"><i></i></div><p class="tip">' + esc(U.pick(TG.TIPS)) + '</p></div></div>';
      thumbInto($('.ld-bg', ctx.el), t.theme);
      $('.flag-slot', ctx.el).appendChild(flagCanvas(cup.flag, 42, 28));
    },
  };

  SCREENS.pause = {
    overlay: true,
    render(ctx) {
      ctx.linear = true;
      const race = TG.Game.race;
      ctx.el.innerHTML = '<div class="pause"><div class="eyebrow">' + esc(race ? race.def.name : '') + '</div><h1>Pausa</h1>' +
        '<button class="btn primary" data-nav data-key="resume">Continuar</button>' +
        '<button class="btn" data-nav data-key="restart">Reiniciar carrera</button>' +
        '<button class="btn" data-nav data-key="opts">Opciones</button>' +
        '<button class="btn ghost" data-nav data-key="quit">Abandonar</button></div>';
      $('[data-key="resume"]', ctx.el).addEventListener('click', () => TG.Game.resume());
      $('[data-key="restart"]', ctx.el).addEventListener('click', () => TG.Game.restart());
      $('[data-key="opts"]', ctx.el).addEventListener('click', () => UI.show('options', { back: () => UI.show('pause') }));
      $('[data-key="quit"]', ctx.el).addEventListener('click', () => UI.modal('<h2>¿Abandonar la carrera?</h2><p>No ganarás premio en esta carrera. En el campeonato podrás repetirla.</p>', [
        { label: 'Abandonar', cls: 'danger', fn: () => TG.Game.quitRace() }, { label: 'Seguir corriendo', cls: 'ghost' },
      ], { focus: 1 }));
      ctx.onBack = () => TG.Game.resume();
    },
  };

  SCREENS.results = {
    overlay: true,
    render(ctx) {
      ctx.linear = true;
      const d = ctx.params;
      const res = d.res;
      const win = res[0].time;
      const mode = d.mode;
      const rows = res.map((r) => {
        const tm = r.pos === 1 ? U.time(r.time) : '+' + (r.time - win).toFixed(2) + ' s';
        const who = r.isPlayer ? (mode === 'versus' ? r.name : 'Tú') : r.name;
        return '<tr class="' + (r.isPlayer ? 'me p' + r.pIndex : '') + '"><td class="pos">' + r.pos + '</td><td>' + esc(who) + '</td><td class="muted">' + esc(r.model.brand + ' ' + r.model.name) + '</td><td class="num">' + (r.finished ? tm : '<span class="muted">' + tm + '</span>') + '</td></tr>';
      }).join('');
      let side = '';
      const e = d.earnings;
      if (e) {
        side = '<div class="card earn"><div class="card-eyebrow">Ganancias</div>' +
          '<div class="erow"><span>Premio por ' + e.pos + 'º puesto</span><b data-count="' + e.prize + '">$0</b></div>' +
          '<div class="erow"><span>Monedas recogidas</span><b data-count="' + e.coins + '">$0</b></div>' +
          (e.clean ? '<div class="erow"><span>Bonus carrera limpia</span><b data-count="' + e.clean + '">$0</b></div>' : '') +
          (e.record ? '<div class="erow"><span>Récord de vuelta</span><b data-count="' + e.record + '">$0</b></div>' : '') +
          '<div class="erow total"><span>Total</span><b data-count="' + e.total + '">$0</b></div>' +
          '<div class="erow bal"><span>Saldo</span><b>' + money(S().money) + '</b></div></div>';
      } else if (mode === 'time') {
        const p = d.race.players[0];
        side = '<div class="card earn"><div class="card-eyebrow">Tus tiempos</div>' +
          (p.laps.map((l, k) => '<div class="erow"><span>Vuelta ' + (k + 1) + '</span><b>' + U.time(l) + '</b></div>').join('') || '<p class="muted">Sin vueltas completas.</p>') +
          '<div class="erow total"><span>Mejor vuelta</span><b>' + U.time(p.bestLap) + '</b></div>' +
          (d.newRecord ? '<div class="erow rec"><span>¡Nuevo récord del circuito!</span><b>★</b></div>' : '') +
          (d.newGhost ? '<div class="erow"><span>Fantasma guardado para la próxima vez</span><b>👻</b></div>' : '') + '</div>';
      } else if (mode === 'versus') {
        const w = res.find((r) => r.isPlayer);
        side = '<div class="card earn"><div class="card-eyebrow">Duelo</div><div class="winner p' + w.pIndex + '">¡Gana ' + esc(w.name) + '!</div></div>';
      }
      let cupInfo = '';
      if (d.cupRun) {
        cupInfo = '<p class="small muted">Copa ' + esc(d.cup.name) + ': carrera ' + d.cupRun.race + ' de 4 completada · tienes ' + (d.cupRun.points.player || 0) + ' puntos.</p>';
      }
      const title = mode === 'time' ? 'Contrarreloj' : res.find((r) => r.isPlayer).pos === 1 ? '¡Victoria!' : 'Resultados';
      ctx.el.innerHTML = '<div class="results"><div class="res-head"><div><div class="eyebrow">' + esc(d.def.name + ' · ' + d.cup.name) + '</div><h1>' + title + '</h1></div></div>' +
        '<div class="res-grid"><div class="card tbl-wrap" data-scroll="res"><table class="tbl res"><thead><tr><th>#</th><th>Piloto</th><th>Coche</th><th class="num">Tiempo</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="res-side">' + side + cupInfo +
        '<button class="btn primary big" data-nav data-key="next">' + (d.cupEnd ? 'Ver clasificación final' : d.cupRun ? 'Siguiente carrera' : 'Continuar') + '</button>' +
        (!d.cupRun && !d.cupEnd ? '<button class="btn" data-nav data-key="again">Repetir carrera</button>' : '') +
        '<button class="btn ghost" data-nav data-key="menu">Menú principal</button></div></div></div>';
      // contador animado
      const counters = $$('[data-count]', ctx.el);
      const t0 = performance.now();
      const anim = (now) => {
        const k = U.clamp((now - t0) / 1100, 0, 1);
        counters.forEach((c) => { c.textContent = money(+c.dataset.count * U.easeOutCubic(k)); });
        if (k < 1 && UI.cur === ctx) requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
      $('[data-key="next"]', ctx.el).addEventListener('click', () => {
        if (d.cupEnd) UI.show('cupEnd', d.cupEnd);
        else if (d.cupRun) { TG.Game.toDemo(); UI.show('cup', { i: d.cup.index }); }
        else TG.Game.backToMenu(mode);
      });
      const ag = $('[data-key="again"]', ctx.el);
      if (ag) ag.addEventListener('click', () => TG.Game.startRace(d.race.cfg));
      $('[data-key="menu"]', ctx.el).addEventListener('click', () => TG.Game.backToMenu());
      ctx.onBack = () => {};
    },
  };

  SCREENS.cupEnd = {
    overlay: true,
    render(ctx) {
      ctx.linear = true;
      const d = ctx.params;
      const rows = d.table.map((r, k) => '<tr class="' + (r.me ? 'me' : '') + '"><td class="pos">' + (k + 1) + '</td><td>' + esc(r.name) + '</td><td class="muted">' + esc(r.car.brand + ' ' + r.car.name) + '</td><td class="num">' + r.pts + '</td></tr>').join('');
      const tNames = ['', 'Oro', 'Plata', 'Bronce'];
      ctx.el.innerHTML = '<div class="results"><div class="res-head"><div><div class="eyebrow">Copa ' + esc(d.cup.name) + ' · clasificación final</div><h1>' + (d.rank === 1 ? '¡Campeón!' : d.rank <= 3 ? '¡Al podio!' : 'Copa terminada') + '</h1></div>' +
        (d.rank <= 3 ? '<div class="big-trophy t' + d.rank + '"><span>' + tNames[d.rank] + '</span></div>' : '') + '</div>' +
        '<div class="res-grid"><div class="card tbl-wrap" data-scroll="cupend"><table class="tbl res"><thead><tr><th>#</th><th>Piloto</th><th>Coche</th><th class="num">Puntos</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="res-side"><div class="card earn"><div class="card-eyebrow">Recompensa</div>' +
        '<div class="erow"><span>Posición final</span><b>' + d.rank + 'º</b></div>' +
        '<div class="erow total"><span>Bonus de copa</span><b>' + money(d.bonus) + '</b></div>' +
        '<div class="erow bal"><span>Saldo</span><b>' + money(S().money) + '</b></div></div>' +
        (d.unlocked ? '<div class="unlock"><span>Nueva copa desbloqueada</span><b>' + esc(d.unlocked) + '</b></div>' : '') +
        (d.rank > 3 ? '<p class="warn-txt">Necesitas terminar entre los 3 primeros para desbloquear la siguiente copa. Mejora tu coche y vuelve a intentarlo.</p>' : '') +
        (d.done ? '<div class="unlock gold"><span>Has completado el campeonato</span><b>¡Leyenda de Top Gear!</b></div>' : '') +
        '<button class="btn primary big" data-nav data-key="ok">Continuar</button></div></div></div>';
      if (d.rank <= 3) TG.Audio.play('trophy');
      $('[data-key="ok"]', ctx.el).addEventListener('click', () => { TG.Game.toDemo(); UI.show('career', { i: d.cup.index }); });
      ctx.onBack = () => {};
    },
  };
})(window.TG);

</script>
<script>
'use strict';
/* ============================================================
   Controlador principal
   ============================================================ */
(function (TG) {
  const U = TG.U;
  const G = (TG.Game = { race: null, paused: false, last: 0, demoT: 0, skipRender: false, fpsAcc: 0, fpsN: 0 });
  const S = () => TG.Save.data;

  G.boot = function () {
    TG.Save.load();
    TG.Input.init();
    TG.Render.init(document.getElementById('game'));
    TG.UI.init();
    TG.Input.on(G.onKey);
    G.startDemo();
    TG.UI.show('title');
    window.addEventListener('blur', () => G.autoPause());
    document.addEventListener('visibilitychange', () => { if (document.hidden) G.autoPause(); });
    window.addEventListener('pointerdown', () => TG.Audio.init());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    requestAnimationFrame(G.loop);
    try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tgApp) window.webkit.messageHandlers.tgApp.postMessage('ready'); } catch (e) { /* navegador */ }
    window.__tgReady = true;
  };

  G.startDemo = function () {
    const ids = Object.keys(TG.TRACKS);
    let tid = U.pick(ids);
    if (G.race && G.race.demo && ids.length > 1) while (tid === G.race.def.id) tid = U.pick(ids);
    const car = U.pick(TG.CARS.filter((c) => c.price >= 200000));
    const race = new TG.Race({ mode: 'demo', trackId: tid, rivals: 9, players: [{ carId: car.id, color: car.color, up: {}, profile: 'solo', autopilot: true, name: '' }] });
    TG.Render.prepare(race);
    G.race = race;
    G.paused = false;
    G.demoT = 0;
  };
  G.toDemo = function () {
    TG.Audio.raceStop();
    G.startDemo();
    TG.Music.play('menu');
  };
  G.backToMenu = function (mode) {
    G.toDemo();
    const focus = mode === 'quick' ? 'quick' : mode === 'time' ? 'time' : mode === 'versus' ? 'versus' : mode === 'career' ? 'career' : null;
    if (mode === 'quick' || mode === 'time' || mode === 'versus') TG.UI.show(mode);
    else TG.UI.show('main', { focus });
  };

  G.startRace = function (cfg) {
    TG.Audio.init();
    TG.Audio.raceStop();
    TG.UI.show('loading', { cfg });
    G.skipRender = true;
    setTimeout(() => {
      try {
        const race = new TG.Race(cfg);
        TG.Render.prepare(race);
        G.race = race;
        G.paused = false;
        G.skipRender = false;
        TG.UI.hide();
        TG.Music.play(race.theme.music || 'race1');
        TG.Audio.raceStart(race);
      } catch (err) {
        console.error(err);
        G.skipRender = false;
        TG.UI.toast('No se pudo preparar la carrera.', 'warn');
        G.toDemo();
        TG.UI.show('main');
      }
    }, 80);
  };

  G.onScreen = function (name, def) {
    G.skipRender = !!def.studio;
  };

  G.qualityChanged = function () {
    TG.Render.carCache.clear();
    if (G.race) TG.Render.prepare(G.race);
  };

  G.toggleFullscreen = function () {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.tgApp) { window.webkit.messageHandlers.tgApp.postMessage('fullscreen'); return; }
    } catch (e) { /* sin puente */ }
    const d = document;
    const quiet = (p) => { if (p && p.catch) p.catch(() => TG.UI.toast('Tu navegador no permite la pantalla completa aquí. Prueba con F11.')); };
    try {
      if (!d.fullscreenElement && !d.webkitFullscreenElement) {
        const el = d.documentElement;
        quiet((el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el));
      } else {
        quiet((d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d));
      }
    } catch (e) { /* no disponible */ }
  };

  G.onKey = function (e, code) {
    const UI = TG.UI;
    if (UI.capture) return false;
    if (code === 'KeyM') {
      TG.Audio.init();
      TG.Audio.musicMuted = !TG.Audio.musicMuted;
      TG.Audio.apply();
      UI.toast(TG.Audio.musicMuted ? 'Música silenciada' : 'Música activada');
      return true;
    }
    if (code === 'F11' || (code === 'KeyF' && (e.metaKey || e.ctrlKey))) { G.toggleFullscreen(); return true; }
    const race = G.race;
    if (race && !race.demo && !UI.cur && (code === 'Escape' || code === 'KeyP')) { G.pause(); return true; }
    if (race && !race.demo && G.paused && UI.cur && UI.cur.name === 'pause' && code === 'KeyP') { G.resume(); return true; }
    return false;
  };

  G.pause = function () {
    const race = G.race;
    if (!race || race.demo || G.paused || race.ended) return;
    G.paused = true;
    TG.Audio.play('pause');
    TG.UI.show('pause');
  };
  G.autoPause = function () {
    if (G.race && !G.race.demo && !G.paused && !TG.UI.cur && G.race.phase !== 'done') G.pause();
  };
  G.resume = function () {
    G.paused = false;
    TG.UI.hide();
    TG.Input.down.clear();
  };
  G.restart = function () {
    const cfg = G.race.cfg;
    G.paused = false;
    G.startRace(cfg);
  };
  G.quitRace = function () {
    G.paused = false;
    G.toDemo();
    TG.UI.show('main');
  };

  /* ---------- Eventos de carrera ---------- */
  G.handleEvents = function (race) {
    if (!race.events.length) return;
    const evs = race.events;
    race.events = [];
    const A = TG.Audio, H = TG.HUD, R = TG.Render;
    for (const e of evs) {
      const v = e.car ? race.views.find((vv) => vv.player === e.car) : null;
      if (race.demo && e.type !== 'end') continue;
      switch (e.type) {
        case 'count': A.play('count'); break;
        case 'go': A.play('go'); break;
        case 'perfect': A.play('perfect'); if (v) H.msg(v, '¡SALIDA PERFECTA!', { col: '#46d98a', dur: 1.6 }); break;
        case 'spin': if (v) H.msg(v, 'PATINAS: DEMASIADAS RPM', { col: '#ff3b3b', slot: 'low', dur: 1.4 }); break;
        case 'nitro': A.play('nitro'); if (v) { H.msg(v, 'NITRO', { col: '#7fd0ff', dur: 0.9 }); v.cam.shake = Math.max(v.cam.shake, 0.35); } break;
        case 'shift': A.play('shift'); break;
        case 'backfire': A.play('pop', e.soft ? 0.55 : 1); break;
        case 'lap': {
          if (!v) break;
          const n = e.car.laps.length;
          const rec = e.best && n > 1;
          A.play(rec ? 'record' : 'lap');
          H.msg(v, 'VUELTA ' + n, { sub: U.time(e.time) + (rec ? '  ·  MEJOR VUELTA' : ''), slot: 'low', dur: 2 });
          break;
        }
        case 'finalLap': A.play('finalLap'); if (v) H.msg(v, '¡ÚLTIMA VUELTA!', { col: '#ff7a1a', dur: 2 }); break;
        case 'finish':
          A.play('finish');
          if (v && e.car.finishPos === 1 && race.mode !== 'time') R.burst(v, 'confetti', 140);
          break;
        case 'crash':
          A.play(e.soft ? 'soft' : 'crash');
          if (v) { v.cam.shake = e.soft ? 0.45 : 1; v.hitFlash = e.soft ? 0.35 : 1; R.burst(v, 'spark', e.soft ? 8 : 28); if (!e.soft) R.burst(v, 'smoke', 8); }
          break;
        case 'bump':
          A.play('bump', U.clamp(0.4 + e.strength * 2, 0.4, 1));
          if (v) { v.cam.shake = Math.max(v.cam.shake, 0.4); R.burst(v, 'spark', 10); }
          break;
        case 'pickup':
          if (!v) break;
          if (e.kind === 'coin') { A.play('coin'); H.float(v, '+' + U.money(e.value)); R.burst(v, 'coin', 10); }
          else if (e.kind === 'fuel') { A.play('fuel'); H.msg(v, '+ GASOLINA', { col: '#ff6a5a', slot: 'low', dur: 1.2 }); }
          else if (e.kind === 'nitro') { A.play('nitroPick'); H.msg(v, '+1 NITRO', { col: '#7fd0ff', slot: 'low', dur: 1.2 }); }
          break;
        case 'lowfuel': A.play('lowfuel'); if (v) H.msg(v, 'GASOLINA BAJA', { col: '#ff3b3b', slot: 'low', dur: 2.2 }); break;
        case 'posUp': A.play('posUp'); if (v) H.msg(v, '▲ ' + e.pos + 'º', { slot: 'pos', col: '#46d98a', dur: 1.2 }); break;
        case 'posDown': A.play('posDown'); if (v) H.msg(v, '▼ ' + e.pos + 'º', { slot: 'pos', col: '#ff3b3b', dur: 1.2 }); break;
        case 'land': A.play('land'); if (v) v.cam.shake = Math.max(v.cam.shake, 0.3); break;
        case 'end': if (!race.demo) G.raceEnd(race); break;
        default: break;
      }
    }
  };

  /* ---------- Final de carrera y economía ---------- */
  G.raceEnd = function (race) {
    const d = S();
    const res = race.results();
    const data = { race, res, mode: race.mode, cup: race.cup, def: race.def };
    const round50 = (x) => Math.round(x / 50) * 50;
    if (race.mode === 'career' || race.mode === 'quick') {
      const p = race.players[0];
      const pr = res.find((r) => r.isPlayer);
      const pos = pr.pos;
      const factor = race.mode === 'quick' ? 0.75 : 1;
      const prize = round50(race.cup.prize * (TG.ECON.prizePct[pos - 1] || 0.01) * factor);
      const coins = p.coinMoney;
      const clean = p.crashes === 0 && p.finished ? round50(race.cup.prize * TG.ECON.clean) : 0;
      const rec = d.records[race.def.id] || {};
      let record = 0;
      if (p.bestLap && (!rec.lap || p.bestLap < rec.lap)) {
        if (rec.lap) record = round50(race.cup.prize * TG.ECON.record);
        rec.lap = p.bestLap; rec.lapCar = p.model.id;
      }
      if (p.finished && (!rec.race || p.finishTime < rec.race)) rec.race = p.finishTime;
      d.records[race.def.id] = rec;
      const total = prize + coins + clean + record;
      d.money += total;
      d.stats.races++;
      if (pos === 1) d.stats.wins++;
      d.stats.earned += total;
      data.earnings = { prize, coins, clean, record, total, pos };
      if (race.mode === 'career') {
        const ci = race.cup.index;
        const run = d.cups[ci].run;
        if (run) {
          res.forEach((r) => {
            const pts = TG.ECON.points[r.pos - 1] || 0;
            const id = r.isPlayer ? 'player' : r.did;
            if (id) run.points[id] = (run.points[id] || 0) + pts;
          });
          run.results.push(pos);
          run.race++;
          data.cupRun = run;
          if (run.race >= 4) {
            const table = TG.UI.standings(run);
            const rank = table.findIndex((r) => r.me) + 1;
            const bonus = rank <= 3 ? round50(race.cup.prize * TG.ECON.cupBonus[rank - 1]) : 0;
            d.money += bonus;
            d.stats.earned += bonus;
            const cs = d.cups[ci];
            if (rank <= 3 && (!cs.trophy || rank < cs.trophy)) cs.trophy = rank;
            let unlocked = null;
            if (rank <= 3 && ci + 1 < TG.CUPS.length && d.unlocked < ci + 2) { d.unlocked = ci + 2; unlocked = TG.CUPS[ci + 1].name; }
            const done = rank <= 3 && ci === TG.CUPS.length - 1;
            cs.run = null;
            data.cupEnd = { cup: race.cup, table, rank, bonus, unlocked, done };
            data.cupRun = null;
          }
        }
      }
    } else if (race.mode === 'time') {
      const p = race.players[0];
      const rec = d.records[race.def.id] || {};
      if (p.bestLap && (!rec.lap || p.bestLap < rec.lap)) { rec.lap = p.bestLap; rec.lapCar = p.model.id; data.newRecord = true; }
      if (p.finished && (!rec.race || p.finishTime < rec.race)) { rec.race = p.finishTime; data.newRecord = true; }
      d.records[race.def.id] = rec;
      const gb = race.ghostBest;
      const old = d.ghosts[race.def.id];
      if (gb && (!old || gb.time < old.time)) { d.ghosts[race.def.id] = gb; data.newGhost = true; }
    }
    TG.Save.save();
    TG.Audio.raceStop();
    TG.Music.play('menu');
    TG.UI.show('results', data);
  };

  /* ---------- Bucle principal ---------- */
  G.loop = function (now) {
    let dt = (now - (G.last || now)) / 1000;
    G.last = now;
    if (!(dt >= 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    TG.Input.frame();
    const race = G.race;
    if (race) {
      try {
        if (!G.paused) race.update(dt);
        G.handleEvents(race);
        if (!G.skipRender) TG.Render.frame(race, G.paused ? 0 : dt);
        TG.Audio.raceUpdate(race, G.paused);
      } catch (err) {
        console.error(err);
        if (!G._errShown) { G._errShown = true; TG.UI.toast('Error: ' + err.message, 'warn'); }
      }
      if (race.demo) {
        G.demoT += dt;
        const cur = TG.UI.cur ? TG.UI.cur.name : '';
        if (G.demoT > 50 && (cur === 'title' || cur === 'main')) G.startDemo();
      }
    }
    // FPS
    G.fpsAcc += dt; G.fpsN++;
    if (G.fpsAcc > 0.5) {
      const el = document.getElementById('fps');
      if (el && S() && S().settings.fps) { el.style.display = 'block'; el.textContent = Math.round(G.fpsN / G.fpsAcc) + ' FPS'; }
      else if (el) el.style.display = 'none';
      G.fpsAcc = 0; G.fpsN = 0;
    }
    requestAnimationFrame(G.loop);
  };

  // Ganchos de prueba por URL (solo desarrollo): ?screen=garage | ?race=vegas&car=chiron&skip=8
  G.testHook = function () {
    const q = new URLSearchParams(location.search);
    if (!q.toString()) return;
    if (q.get('money')) S().money = +q.get('money');
    if (q.get('own')) q.get('own').split(',').forEach((id) => { if (TG.CAR[id] && !S().cars[id]) S().cars[id] = { color: TG.CAR[id].color, up: {} }; });
    if (q.get('unlock')) S().unlocked = +q.get('unlock');
    if (q.get('quality')) { S().settings.quality = q.get('quality'); TG.Render.resize(); }
    if (q.get('race')) {
      const carId = q.get('car') || 'mustang';
      if (!S().cars[carId]) S().cars[carId] = { color: TG.CAR[carId].color, up: {} };
      const cfg = { mode: q.get('mode') || 'quick', trackId: q.get('race'), laps: +(q.get('laps') || 3), rivals: +(q.get('rivals') || 11), players: [TG.UI.carCfg(carId, 'solo', 'Tú')] };
      if (q.get('p2')) { cfg.mode = 'versus'; cfg.players[0].profile = 'p1'; const c2 = q.get('p2'); if (!S().cars[c2]) S().cars[c2] = { color: TG.CAR[c2].color, up: {} }; cfg.players.push(TG.UI.carCfg(c2, 'p2', 'Jugador 2')); cfg.players[1].color = '#7fcbe8'; }
      const race = new TG.Race(cfg);
      if (q.get('auto')) race.players.forEach((p) => { p.autopilot = true; });
      TG.Render.prepare(race);
      G.race = race;
      TG.UI.hide();
      const skip = +(q.get('skip') || 0);
      for (let t = 0; t < skip; t += 1 / 60) { race.update(1 / 60); race.events = []; }
      if (q.get('nitro')) race.players.forEach((p) => { p.nitroT = 2; });
      if (q.get('freeze')) { race.update(0); G.paused = true; }
      if (q.get('end')) { G.raceEnd(race); }
      return;
    }
    if (q.get('screen')) {
      const params = {};
      if (q.get('i')) params.i = +q.get('i');
      if (q.get('carp')) params.car = q.get('carp');
      TG.UI.show(q.get('screen'), params);
    }
  };

  window.addEventListener('DOMContentLoaded', () => {
    try { G.boot(); G.testHook(); } catch (err) {
      console.error(err);
      document.body.innerHTML = '<pre style="color:#fff;padding:24px;font:14px monospace">Error al iniciar: ' + String(err && err.stack || err) + '</pre>';
    }
  });
})(window.TG);

</script>
