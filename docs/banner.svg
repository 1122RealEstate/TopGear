<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Top Gear · Supercar Legends">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e28"/>
      <stop offset="0.5" stop-color="#3b1a5e"/>
      <stop offset="0.85" stop-color="#c2456a"/>
      <stop offset="1" stop-color="#ff8a4a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a0"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff5a5f"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dfe5ec"/>
      <stop offset="0.52" stop-color="#7f8a98"/>
      <stop offset="0.62" stop-color="#cfd6df"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a5a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sunclip"><circle cx="600" cy="205" r="120"/></clipPath>
    <clipPath id="road"><polygon points="590,215 610,215 1000,340 200,340"/></clipPath>
    <clipPath id="txt"><text x="600" y="150" text-anchor="middle" class="gear">GEAR</text></clipPath>
    <style>
      .gear { font: italic 900 132px "Avenir Next Condensed", Futura, "Arial Black", Impact, sans-serif; letter-spacing: -2px; }
      .top { font: italic 800 38px "Avenir Next Condensed", Futura, "Arial Black", Impact, sans-serif; letter-spacing: 16px; fill: #7fcbe8; }
      .sub { font: 700 20px "DIN Alternate", "DIN Condensed", Bahnschrift, Arial, sans-serif; letter-spacing: 12px; fill: #f3f5f8; }
      .dash { animation: dash .6s linear infinite; }
      .rumble { animation: rumble .5s linear infinite; }
      .stars circle { animation: twinkle 3s ease-in-out infinite; }
      .stars circle:nth-child(2n) { animation-delay: 1.2s; }
      .stars circle:nth-child(3n) { animation-delay: 2.1s; }
      .sweep { animation: sweep 3.6s ease-in-out infinite; }
      .car { animation: sway 2.4s ease-in-out infinite; transform-origin: 600px 320px; }
      .brake { animation: brake 2.4s ease-in-out infinite; }
      .speed line { stroke: #fff; stroke-width: 2; stroke-linecap: round; animation: zoom 1.1s linear infinite; opacity: 0; }
      .speed line:nth-child(2) { animation-delay: .3s; } .speed line:nth-child(3) { animation-delay: .6s; } .speed line:nth-child(4) { animation-delay: .85s; }
      .speed line:nth-child(5) { animation-delay: .15s; } .speed line:nth-child(6) { animation-delay: .45s; }
      .stripe { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -80; } }
      @keyframes rumble { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
      @keyframes twinkle { 50% { opacity: .15; } }
      @keyframes sweep { 0% { transform: translateX(-520px); } 55%, 100% { transform: translateX(520px); } }
      @keyframes sway { 0%, 100% { transform: translateX(-26px) rotate(-1deg); } 50% { transform: translateX(26px) rotate(1deg); } }
      @keyframes brake { 0%, 40%, 100% { opacity: .35; } 50%, 60% { opacity: 1; } }
      @keyframes zoom { 0% { opacity: 0; transform: scale(.6); } 30% { opacity: .5; } 100% { opacity: 0; transform: scale(1.4); } }
      @keyframes pulse { 50% { opacity: .75; } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <g class="stars" fill="#fff">
    <circle cx="80" cy="30" r="1.6"/><circle cx="190" cy="70" r="1.2"/><circle cx="310" cy="24" r="1.8"/><circle cx="420" cy="58" r="1.1"/>
    <circle cx="760" cy="36" r="1.5"/><circle cx="880" cy="80" r="1.2"/><circle cx="990" cy="28" r="1.8"/><circle cx="1110" cy="64" r="1.3"/>
    <circle cx="540" cy="18" r="1.1"/><circle cx="660" cy="44" r="1.4"/><circle cx="1160" cy="22" r="1.2"/><circle cx="30" cy="90" r="1.1"/>
  </g>
  <circle cx="600" cy="205" r="300" fill="url(#glow)"/>
  <g clip-path="url(#sunclip)">
    <rect x="480" y="85" width="240" height="240" fill="url(#sun)"/>
    <rect x="480" y="190" width="240" height="5" fill="#7a2a5e"/>
    <rect x="480" y="202" width="240" height="7" fill="#7a2a5e"/>
    <rect x="480" y="216" width="240" height="9" fill="#7a2a5e"/>
  </g>
  <polygon points="0,215 90,150 180,190 290,120 400,185 500,150 600,200 700,140 820,190 930,125 1040,180 1120,150 1200,190 1200,215" fill="#4a2466"/>
  <polygon points="0,215 110,185 230,205 360,180 470,208 600,195 740,208 860,178 990,205 1100,186 1200,200 1200,215" fill="#2c1646"/>
  <rect y="215" width="1200" height="125" fill="#150c24"/>
  <polygon points="590,215 610,215 1000,340 200,340" fill="#2b2e3a"/>
  <g clip-path="url(#road)">
    <line class="rumble" x1="590" y1="215" x2="200" y2="340" stroke="#e8303a" stroke-width="16" stroke-dasharray="30 30"/>
    <line class="rumble" x1="590" y1="215" x2="200" y2="340" stroke="#f4f4f4" stroke-width="16" stroke-dasharray="30 30" stroke-dashoffset="30" style="animation-delay:-.25s"/>
    <line class="rumble" x1="610" y1="215" x2="1000" y2="340" stroke="#e8303a" stroke-width="16" stroke-dasharray="30 30"/>
    <line class="rumble" x1="610" y1="215" x2="1000" y2="340" stroke="#f4f4f4" stroke-width="16" stroke-dasharray="30 30" stroke-dashoffset="30" style="animation-delay:-.25s"/>
    <line class="dash" x1="600" y1="215" x2="600" y2="340" stroke="#f4f4f4" stroke-width="6" stroke-dasharray="40 40"/>
  </g>
  <g class="speed" transform="translate(600 215)">
    <line x1="-120" y1="20" x2="-260" y2="70"/><line x1="130" y1="15" x2="280" y2="60"/><line x1="-80" y1="40" x2="-190" y2="110"/>
    <line x1="90" y1="45" x2="210" y2="115"/><line x1="-200" y1="5" x2="-380" y2="30"/><line x1="210" y1="5" x2="390" y2="28"/>
  </g>

  <!-- coche visto desde atrás -->
  <g class="car">
    <ellipse cx="600" cy="332" rx="92" ry="9" fill="#000" opacity=".45"/>
    <rect x="522" y="296" width="30" height="34" rx="7" fill="#101114"/>
    <rect x="648" y="296" width="30" height="34" rx="7" fill="#101114"/>
    <path d="M520,316 C512,300 514,282 530,274 L556,262 L644,262 L670,274 C686,282 688,300 680,316 Z" fill="#1766d6"/>
    <path d="M556,262 L566,240 L634,240 L644,262 Z" fill="#1a4fa8"/>
    <path d="M562,262 L570,245 L630,245 L638,262 Z" fill="#141c2a"/>
    <rect x="590" y="240" width="7" height="76" fill="#f2f2f2"/><rect x="603" y="240" width="7" height="76" fill="#f2f2f2"/>
    <rect x="530" y="276" width="140" height="14" rx="4" fill="#0a0b0e"/>
    <g class="brake" fill="#ff2436">
      <rect x="536" y="279" width="5" height="9"/><rect x="544" y="279" width="5" height="9"/><rect x="552" y="279" width="5" height="9"/>
      <rect x="643" y="279" width="5" height="9"/><rect x="651" y="279" width="5" height="9"/><rect x="659" y="279" width="5" height="9"/>
    </g>
    <rect x="585" y="296" width="30" height="9" rx="2" fill="#f4f4ef"/>
    <path d="M532,316 L668,316 L660,326 L540,326 Z" fill="#16181c"/>
    <circle cx="548" cy="320" r="4" fill="#9aa0a8"/><circle cx="558" cy="320" r="4" fill="#9aa0a8"/>
    <circle cx="642" cy="320" r="4" fill="#9aa0a8"/><circle cx="652" cy="320" r="4" fill="#9aa0a8"/>
  </g>

  <!-- logotipo -->
  <text x="608" y="58" text-anchor="middle" class="top">TOP</text>
  <text x="600" y="150" text-anchor="middle" class="gear" fill="url(#chrome)" stroke="rgba(0,0,0,.35)" stroke-width="2">GEAR</text>
  <g clip-path="url(#txt)"><rect class="sweep" x="480" y="40" width="240" height="130" fill="url(#shine)" transform="skewX(-20)"/></g>
  <g class="stripe" transform="skewX(-30)">
    <rect x="530" y="168" width="60" height="8" fill="#7fcbe8"/>
    <rect x="605" y="168" width="200" height="8" fill="#ff7a1a"/>
    <rect x="820" y="168" width="60" height="8" fill="#7fcbe8"/>
  </g>
  <text x="606" y="202" text-anchor="middle" class="sub">SUPERCAR LEGENDS</text>
</svg>
